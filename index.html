<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Shape Defense</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #06080d;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  touch-action: manipulation;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: 100%;
  max-width: 520px;
  height: 100dvh;
  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #171c2a 0%,
      #0b0e16 48%,
      #05070b 100%
    );
}

/* =========================
   HUD
========================= */

#topBar {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 50px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 5px 9px;

  z-index: 100;

  background: rgba(5, 7, 12, .94);

  border-bottom:
    1px solid rgba(255,255,255,.08);

  backdrop-filter: blur(8px);
}

.stat {
  min-width: 80px;
}

.statTitle {
  font-size: 8px;
  color: #7e879b;
  text-transform: uppercase;
  margin-bottom: 1px;
}

.statValue {
  font-size: 13px;
  font-weight: bold;
}

#waveBox {
  text-align: center;
}

#waveLabel {
  font-size: 8px;
  color: #7e879b;
  text-transform: uppercase;
}

#waveNumber {
  font-size: 16px;
  font-weight: bold;
}

#money {
  text-align: right;
}

#money .statValue {
  color: #ffd54a;
}


/* =========================
   BARRA DE PROGRESSO
========================= */

#progressContainer {
  position: absolute;

  top: 50px;
  left: 0;

  width: 100%;
  height: 18px;

  padding: 4px 9px;

  z-index: 105;

  background: rgba(5, 7, 12, .88);
}

#progressBar {
  position: relative;

  width: 100%;
  height: 7px;

  background: #202532;

  border-radius: 10px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.08);
}

#progressFill {
  width: 0%;
  height: 100%;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #438cff,
      #66b8ff
    );

  transition:
    width .18s ease-out;
}

#progressText {
  position: absolute;

  top: 0;
  left: 50%;

  transform: translateX(-50%);

  font-size: 7px;

  line-height: 18px;

  color: rgba(255,255,255,.72);

  pointer-events: none;

  white-space: nowrap;
}


/* =========================
   CAMPO
========================= */

#battlefield {
  position: absolute;

  top: 68px;
  left: 0;

  width: 100%;

  bottom: 270px;

  overflow: hidden;
}

#battlefield::before {
  content: "";

  position: absolute;

  inset: 0;

  opacity: .22;

  background-image:
    linear-gradient(
      rgba(255,255,255,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.045) 1px,
      transparent 1px
    );

  background-size: 35px 35px;

  pointer-events: none;
}

#arena {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 88%;
  height: 88%;

  transform:
    translate(-50%, -50%);

  border:
    1px solid rgba(100,150,220,.12);

  border-radius: 50%;

  box-shadow:
    inset 0 0 70px
    rgba(50,100,180,.07);

  pointer-events: none;
}


/* =========================
   TORRE
========================= */

#towerArea {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 120px;
  height: 120px;

  transform:
    translate(-50%, -50%);

  z-index: 50;
}

#towerRange {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 320px;
  height: 320px;

  border-radius: 50%;

  border:
    1px dashed rgba(90,170,255,.18);

  pointer-events: none;
}

#tower {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 58px;
  height: 68px;

  transform:
    translate(-50%, -50%);
}

.towerBody {
  position: absolute;

  left: 6px;
  bottom: 0;

  width: 46px;
  height: 40px;

  border-radius: 7px;

  background:
    linear-gradient(
      145deg,
      #899ab5,
      #354158
    );

  border:
    2px solid #b7c5d9;

  box-shadow:
    0 0 20px
    rgba(80,150,255,.25),

    inset 0 0 15px
    rgba(255,255,255,.08);
}

.towerHead {
  position: absolute;

  left: 15px;
  bottom: 30px;

  width: 28px;
  height: 30px;

  border-radius: 6px;

  background: #596983;

  border:
    2px solid #c0ccdf;

  z-index: 3;
}

.towerBarrel {
  position: absolute;

  left: 25px;
  top: 0;

  width: 8px;
  height: 34px;

  border-radius: 4px;

  background: #dce3ef;

  transform-origin:
    50% 100%;

  z-index: 5;

  transition:
    transform .08s linear;
}

.towerCore {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 11px;
  height: 11px;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background: #66b8ff;

  box-shadow:
    0 0 13px #66b8ff;

  z-index: 10;
}

#towerHp {
  position: absolute;

  left: 50%;
  bottom: -11px;

  transform:
    translateX(-50%);

  width: 90px;
  height: 6px;

  background: #202532;

  border-radius: 10px;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.12);

  z-index: 20;
}

#towerHpFill {
  width: 100%;
  height: 100%;

  background: #5de58a;

  transition:
    width .15s;
}


/* =========================
   INIMIGOS
========================= */

.enemy {
  position: absolute;

  width: 30px;
  height: 30px;

  transform:
    translate(-50%, -50%);

  z-index: 30;
}

.enemyHp {
  position: absolute;

  left: 50%;
  top: -7px;

  width: 34px;
  height: 4px;

  transform:
    translateX(-50%);

  background: #20242e;

  border-radius: 10px;

  overflow: hidden;
}

.enemyHpFill {
  width: 100%;
  height: 100%;

  background: #6de18c;
}

.enemyShape {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 22px;
  height: 22px;

  transform:
    translate(-50%, -50%);
}

.circle {
  border-radius: 50%;

  background: #4d9cff;

  box-shadow:
    0 0 12px
    rgba(77,156,255,.8);
}

.square {
  background: #ff4e61;

  border-radius: 4px;

  box-shadow:
    0 0 11px
    rgba(255,78,97,.75);
}

.triangle {
  width: 0;
  height: 0;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-left:
    13px solid transparent;

  border-right:
    13px solid transparent;

  border-bottom:
    24px solid #ffd04c;

  filter:
    drop-shadow(
      0 0 7px
      rgba(255,208,76,.8)
    );
}

.star {
  background: #c56cff;

  clip-path:
    polygon(
      50% 0%,
      61% 36%,
      100% 36%,
      69% 58%,
      81% 100%,
      50% 74%,
      19% 100%,
      31% 58%,
      0% 36%,
      39% 36%
    );
}

.hexagon {
  background: #8793a8;

  clip-path:
    polygon(
      25% 3%,
      75% 3%,
      100% 50%,
      75% 97%,
      25% 97%,
      0% 50%
    );
}

.diamond {
  background: #36e6c1;

  transform:
    translate(-50%, -50%)
    rotate(45deg);

  border-radius: 4px;

  box-shadow:
    0 0 12px
    rgba(54,230,193,.8);
}

.boss {
  width: 48px;
  height: 48px;
}

.boss .enemyShape {
  width: 38px;
  height: 38px;
}

.boss .enemyHp {
  width: 58px;
  height: 6px;
}


/* =========================
   PROJÉTEIS
========================= */

.projectile {
  position: absolute;

  width: 6px;
  height: 6px;

  border-radius: 50%;

  pointer-events: none;

  z-index: 80;
}

.projectile.sniper {
  width: 10px;
  height: 10px;

  background: #78b9ff;

  box-shadow:
    0 0 13px #78b9ff;
}

.projectile.pistol {
  width: 6px;
  height: 6px;

  background: #ff6675;

  box-shadow:
    0 0 8px #ff6675;
}

.projectile.burst {
  background: #ffd45c;

  box-shadow:
    0 0 8px #ffd45c;
}

.projectile.enemyBullet {
  width: 7px;
  height: 7px;

  background: #ff5570;

  box-shadow:
    0 0 9px #ff5570;
}

.laser {
  position: absolute;

  height: 2px;

  transform-origin:
    0 50%;

  background: #3de8c2;

  box-shadow:
    0 0 8px #3de8c2;

  pointer-events: none;

  z-index: 25;
}


/* =========================
   EFEITOS
========================= */

.explosion {
  position: absolute;

  width: 16px;
  height: 16px;

  border:
    2px solid #ffb94c;

  border-radius: 50%;

  transform:
    translate(-50%, -50%);

  animation:
    explode .35s forwards;

  pointer-events: none;

  z-index: 90;
}

@keyframes explode {

  from {
    opacity: 1;

    width: 16px;
    height: 16px;
  }

  to {
    opacity: 0;

    width: 75px;
    height: 75px;
  }

}

.damageText {
  position: absolute;

  z-index: 200;

  pointer-events: none;

  font-size: 11px;

  font-weight: bold;

  color: white;

  transform:
    translate(-50%,0);

  animation:
    floatDamage .55s forwards;
}

.damageText.critical {
  color: #ff3b4d;

  font-size: 13px;

  text-shadow:
    0 0 6px
    rgba(255,40,60,.7);
}

@keyframes floatDamage {

  from {
    opacity: 1;

    transform:
      translate(-50%,0)
      scale(1);
  }

  to {
    opacity: 0;

    transform:
      translate(-50%,-28px)
      scale(1.05);
  }

}


/* =========================
   MENSAGENS
========================= */

#bossMessage {
  position: absolute;

  top: 12px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 150;

  display: none;

  width: 90%;

  text-align: center;

  padding: 7px;

  border-radius: 7px;

  background:
    rgba(80,20,100,.85);

  border:
    1px solid
    rgba(220,120,255,.4);

  color: #e8b7ff;

  font-size: 11px;

  font-weight: bold;
}

#swarmMessage {
  position: absolute;

  top: 42px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 150;

  display: none;

  width: 90%;

  text-align: center;

  padding: 6px;

  border-radius: 7px;

  background:
    rgba(120,60,10,.88);

  border:
    1px solid
    rgba(255,190,70,.45);

  color: #ffd77a;

  font-size: 10px;

  font-weight: bold;
}


/* =========================
   PAINEL INFERIOR
========================= */

#bottomPanel {
  position: absolute;

  bottom: 0;
  left: 0;

  width: 100%;
  height: 270px;

  padding: 7px 9px;

  z-index: 100;

  background:
    rgba(10,13,21,.98);

  border-top:
    1px solid
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(10px);
}

#towerInfo {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 6px;
}

#towerName {
  font-size: 13px;
  font-weight: bold;
}

#towerLevel {
  font-size: 9px;
  color: #8993a8;
}

#upgradeGrid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 5px;
}

.upgrade {
  min-height: 45px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 8px;

  background: #151a26;

  color: white;

  padding: 5px 7px;

  text-align: left;

  cursor: pointer;

  position: relative;

  z-index: 200;

  transition:
    transform .08s,
    background .1s;
}

.upgrade:active {
  transform:
    scale(.96);

  background: #20283a;
}

.upgrade.cantBuy {
  opacity: .45;
}

.upgradeTop {
  display: flex;

  justify-content: space-between;
}

.upgradeName {
  font-size: 10px;
  font-weight: bold;
}

.upgradeLevel {
  font-size: 9px;
  color: #7d879c;
}

.upgradeBottom {
  display: flex;

  justify-content: space-between;

  margin-top: 3px;
}

.upgradeEffect {
  font-size: 8px;
  color: #8993a8;
}

.upgradeCost {
  font-size: 9px;
  color: #ffd54a;
  font-weight: bold;
}

#startButton {
  width: 100%;
  height: 36px;

  margin-top: 6px;

  border: none;

  border-radius: 8px;

  background:
    linear-gradient(
      135deg,
      #438cff,
      #675bff
    );

  color: white;

  font-size: 12px;

  font-weight: bold;

  cursor: pointer;
}

#startButton:active {
  transform:
    scale(.98);
}


/* =========================
   GAME OVER
========================= */

#overlay {
  position: absolute;

  inset: 0;

  z-index: 300;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(2,4,8,.86);

  backdrop-filter:
    blur(8px);
}

#overlayBox {
  width: 86%;
  max-width: 370px;

  padding: 25px 20px;

  border-radius: 18px;

  text-align: center;

  background: #111621;

  border:
    1px solid
    rgba(255,255,255,.12);
}

#overlayTitle {
  font-size: 25px;

  font-weight: bold;

  margin-bottom: 10px;
}

#overlayText {
  color: #9ba5b8;

  line-height: 1.5;

  margin-bottom: 20px;
}

#retryButton {
  width: 100%;
  height: 46px;

  border: none;

  border-radius: 10px;

  background: #438cff;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}


/* =========================
   TELAS BAIXAS
========================= */

@media (max-height: 700px) {

  #battlefield {
    bottom: 245px;
  }

  #bottomPanel {
    height: 245px;
  }

  .upgrade {
    min-height: 40px;
  }

}
</style>
</head>


<body>

<div id="game">


  <!-- HUD -->

  <div id="topBar">

    <div class="stat">

      <div class="statTitle">
        Vida
      </div>

      <div class="statValue">
        <span id="hpText">
          1000
        </span>
      </div>

    </div>


    <div id="waveBox">

      <div id="waveLabel">
        Rodada
      </div>

      <div id="waveNumber">
        1
      </div>

    </div>


    <div class="stat" id="money">

      <div class="statTitle">
        Moedas
      </div>

      <div class="statValue">
        <span id="moneyText">
          150
        </span>
      </div>

    </div>

  </div>


  <!-- PROGRESSO -->

  <div id="progressContainer">

    <div id="progressBar">

      <div id="progressFill"></div>

    </div>

    <div id="progressText">
      0 / 0
    </div>

  </div>


  <!-- CAMPO -->

  <div id="battlefield">

    <div id="arena"></div>


    <div id="bossMessage">
      BOSS DA RODADA
    </div>


    <div id="swarmMessage">
      ENXAME DE MONSTROS
    </div>


    <div id="towerArea">

      <div id="towerRange"></div>


      <div id="tower">

        <div
          class="towerBarrel"
          id="towerBarrel">
        </div>

        <div class="towerHead"></div>

        <div class="towerBody"></div>

        <div class="towerCore"></div>


        <div id="towerHp">

          <div id="towerHpFill"></div>

        </div>

      </div>

    </div>

  </div>


  <!-- PAINEL -->

  <div id="bottomPanel">

    <div id="towerInfo">

      <div>

        <div id="towerName">
          TORRE CENTRAL
        </div>

        <div id="towerLevel">
          Nível
          <span id="levelText">
            1
          </span>
        </div>

      </div>


      <div>

        Dano
        <span id="damageText">
          20
        </span>

      </div>

    </div>


    <div id="upgradeGrid">


      <button
        class="upgrade"
        id="upgradeDamage">

        <div class="upgradeTop">

          <span class="upgradeName">
            Dano
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            +8 dano
          </span>

          <span class="upgradeCost">
            50
          </span>

        </div>

      </button>


      <button
        class="upgrade"
        id="upgradeSpeed">

        <div class="upgradeTop">

          <span class="upgradeName">
            Velocidade
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            +10%
          </span>

          <span class="upgradeCost">
            70
          </span>

        </div>

      </button>


      <button
        class="upgrade"
        id="upgradeRange">

        <div class="upgradeTop">

          <span class="upgradeName">
            Alcance
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            +15
          </span>

          <span class="upgradeCost">
            80
          </span>

        </div>

      </button>


      <button
        class="upgrade"
        id="upgradeHealth">

        <div class="upgradeTop">

          <span class="upgradeName">
            Vida
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            +150 HP
          </span>

          <span class="upgradeCost">
            100
          </span>

        </div>

      </button>


      <button
        class="upgrade"
        id="upgradeDefense">

        <div class="upgradeTop">

          <span class="upgradeName">
            Defesa
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            -5% dano
          </span>

          <span class="upgradeCost">
            120
          </span>

        </div>

      </button>


      <button
        class="upgrade"
        id="upgradeCrit">

        <div class="upgradeTop">

          <span class="upgradeName">
            Crítico
          </span>

          <span class="upgradeLevel">
            Lv.
            <span>1</span>
          </span>

        </div>

        <div class="upgradeBottom">

          <span class="upgradeEffect">
            +3%
          </span>

          <span class="upgradeCost">
            150
          </span>

        </div>

      </button>

    </div>


    <button id="startButton">
      COMEÇAR RODADA 1
    </button>

  </div>


  <!-- GAME OVER -->

  <div id="overlay">

    <div id="overlayBox">

      <div id="overlayTitle">
        TORRE DESTRUÍDA
      </div>


      <div id="overlayText">

        Você chegou à rodada
        <strong id="lostWave">
          1
        </strong>.

        <br><br>

        Suas moedas foram mantidas.

        <br>

        Seus upgrades foram mantidos.

        <br><br>

        Tente novamente a mesma rodada.

      </div>


      <button id="retryButton">
        TENTAR NOVAMENTE
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   ELEMENTOS
========================= */

const battlefield =
  document.getElementById(
    "battlefield"
  );

const towerBarrel =
  document.getElementById(
    "towerBarrel"
  );

const towerRange =
  document.getElementById(
    "towerRange"
  );

const towerHpFill =
  document.getElementById(
    "towerHpFill"
  );

const hpText =
  document.getElementById(
    "hpText"
  );

const moneyText =
  document.getElementById(
    "moneyText"
  );

const waveNumber =
  document.getElementById(
    "waveNumber"
  );

const damageText =
  document.getElementById(
    "damageText"
  );

const levelText =
  document.getElementById(
    "levelText"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const lostWave =
  document.getElementById(
    "lostWave"
  );

const retryButton =
  document.getElementById(
    "retryButton"
  );

const bossMessage =
  document.getElementById(
    "bossMessage"
  );

const swarmMessage =
  document.getElementById(
    "swarmMessage"
  );

const progressFill =
  document.getElementById(
    "progressFill"
  );

const progressText =
  document.getElementById(
    "progressText"
  );


/* =========================
   SAVE
========================= */

let game = {

  money: 150,

  wave: 1,

  tower: {

    level: 1,

    hp: 1000,

    maxHp: 1000,

    damage: 20,

    attackSpeed: 800,

    range: 170,

    defense: 0,

    crit: 0

  },

  upgrades: {

    damage: 1,
    speed: 1,
    range: 1,
    health: 1,
    defense: 1,
    crit: 1

  }

};


function loadGame() {

  const save =
    localStorage.getItem(
      "shapeDefenseSave"
    );

  if (!save)
    return;


  try {

    const data =
      JSON.parse(save);


    if (
      data &&
      typeof data.money ===
        "number" &&
      typeof data.wave ===
        "number" &&
      data.tower &&
      data.upgrades
    ) {

      game = data;

    }

  }

  catch {

    console.log(
      "Não foi possível carregar o save."
    );

  }

}


function saveGame() {

  try {

    localStorage.setItem(
      "shapeDefenseSave",
      JSON.stringify(game)
    );

  }

  catch {

    console.log(
      "Não foi possível salvar."
    );

  }

}


/* =========================
   ESTADO
========================= */

let enemies = [];

let projectiles = [];

let enemyProjectiles = [];

let waveRunning = false;

let spawnTimer = null;

let attackTimer = null;

let enemiesToSpawn = 0;

let enemiesSpawned = 0;

let enemiesKilled = 0;

let totalWaveEnemies = 0;

let bossPending = false;


/* =========================
   POSIÇÃO
========================= */

function getTowerPosition() {

  return {

    x:
      battlefield.clientWidth /
      2,

    y:
      battlefield.clientHeight /
      2

  };

}


function distanceToTower(enemy) {

  const tower =
    getTowerPosition();


  return Math.hypot(

    enemy.x -
      tower.x,

    enemy.y -
      tower.y

  );

}


/* =========================
   VISIBILIDADE
========================= */

function isEnemyFullyVisible(enemy) {

  const width =
    battlefield.clientWidth;

  const height =
    battlefield.clientHeight;


  const half =
    enemy.isBoss
      ? 24
      : 15;


  return (

    enemy.x - half >= 0 &&

    enemy.x + half <= width &&

    enemy.y - half >= 0 &&

    enemy.y + half <= height

  );

}


/* =========================
   PROGRESSO
========================= */

function updateProgress() {

  if (
    totalWaveEnemies <= 0
  ) {

    progressFill.style.width =
      "0%";

    progressText.textContent =
      "0 / 0";

    return;

  }


  const percent =
    Math.max(

      0,

      Math.min(

        100,

        (
          enemiesKilled /
          totalWaveEnemies
        ) * 100

      )

    );


  progressFill.style.width =
    percent + "%";


  progressText.textContent =
    enemiesKilled +
    " / " +
    totalWaveEnemies;

}


/* =========================
   HUD
========================= */

function updateUI() {

  moneyText.textContent =
    Math.floor(
      game.money
    );


  hpText.textContent =
    Math.max(
      0,
      Math.floor(
        game.tower.hp
      )
    );


  waveNumber.textContent =
    game.wave;


  damageText.textContent =
    Math.floor(
      game.tower.damage
    );


  levelText.textContent =
    game.tower.level;


  const hpPercent =
    Math.max(

      0,

      Math.min(

        100,

        game.tower.hp /
        game.tower.maxHp *
        100

      )

    );


  towerHpFill.style.width =
    hpPercent + "%";


  towerRange.style.width =
    game.tower.range *
    2 +
    "px";


  towerRange.style.height =
    game.tower.range *
    2 +
    "px";


  updateUpgradeUI();

  updateProgress();

}


/* =========================
   UPGRADES
========================= */

const upgradeButtons = {

  damage:
    document.getElementById(
      "upgradeDamage"
    ),

  speed:
    document.getElementById(
      "upgradeSpeed"
    ),

  range:
    document.getElementById(
      "upgradeRange"
    ),

  health:
    document.getElementById(
      "upgradeHealth"
    ),

  defense:
    document.getElementById(
      "upgradeDefense"
    ),

  crit:
    document.getElementById(
      "upgradeCrit"
    )

};


function getUpgradeCost(type) {

  const level =
    game.upgrades[type];


  const baseCosts = {

    damage: 50,

    speed: 70,

    range: 80,

    health: 100,

    defense: 120,

    crit: 150

  };


  return Math.floor(

    baseCosts[type] *

    Math.pow(
      1.23,
      level - 1
    )

  );

}


function updateUpgradeUI() {

  for (
    const type in upgradeButtons
  ) {

    const button =
      upgradeButtons[type];

    const level =
      game.upgrades[type];

    const cost =
      getUpgradeCost(type);


    button.querySelector(
      ".upgradeLevel span"
    ).textContent =
      level;


    button.querySelector(
      ".upgradeCost"
    ).textContent =
      cost;


    if (
      game.money < cost
    ) {

      button.classList.add(
        "cantBuy"
      );

    }

    else {

      button.classList.remove(
        "cantBuy"
      );

    }

  }

}


function buyUpgrade(type) {

  const cost =
    getUpgradeCost(type);


  if (
    game.money < cost
  )
    return;


  game.money -=
    cost;


  game.upgrades[type]++;


  if (
    type === "damage"
  ) {

    game.tower.damage +=

      8 +

      Math.floor(
        game.upgrades.damage *
        1.5
      );

  }


  if (
    type === "speed"
  ) {

    game.tower.attackSpeed *=
      .90;


    game.tower.attackSpeed =
      Math.max(
        180,
        game.tower.attackSpeed
      );


    if (waveRunning) {

      restartAttackTimer();

    }

  }


  if (
    type === "range"
  ) {

    game.tower.range +=
      15;

  }


  if (
    type === "health"
  ) {

    game.tower.maxHp +=
      150;

    game.tower.hp =
      game.tower.maxHp;

  }


  if (
    type === "defense"
  ) {

    game.tower.defense +=
      .05;


    game.tower.defense =
      Math.min(
        .75,
        game.tower.defense
      );

  }


  if (
    type === "crit"
  ) {

    game.tower.crit +=
      .03;


    game.tower.crit =
      Math.min(
        .75,
        game.tower.crit
      );

  }


  game.tower.level++;


  saveGame();

  updateUI();

}


upgradeButtons.damage.onclick =
  () => buyUpgrade("damage");

upgradeButtons.speed.onclick =
  () => buyUpgrade("speed");

upgradeButtons.range.onclick =
  () => buyUpgrade("range");

upgradeButtons.health.onclick =
  () => buyUpgrade("health");

upgradeButtons.defense.onclick =
  () => buyUpgrade("defense");

upgradeButtons.crit.onclick =
  () => buyUpgrade("crit");


/* =========================
   ATAQUE DA TORRE
========================= */

function restartAttackTimer() {

  clearInterval(
    attackTimer
  );


  attackTimer =
    setInterval(

      towerAttack,

      game.tower.attackSpeed

    );

}


/* =========================
   TIPOS
========================= */

function chooseEnemyType() {

  const roll =
    Math.random();

  const wave =
    game.wave;


  if (wave < 3) {

    return roll < .7
      ? "square"
      : "circle";

  }


  if (wave < 5) {

    if (
      roll < .45
    )
      return "square";


    if (
      roll < .75
    )
      return "circle";


    return "triangle";

  }


  if (wave < 10) {

    if (
      roll < .30
    )
      return "square";


    if (
      roll < .55
    )
      return "circle";


    if (
      roll < .75
    )
      return "triangle";


    return "hexagon";

  }


  if (
    roll < .20
  )
    return "square";


  if (
    roll < .40
  )
    return "circle";


  if (
    roll < .58
  )
    return "triangle";


  if (
    roll < .73
  )
    return "hexagon";


  if (
    roll < .88
  )
    return "diamond";


  return "star";

}


/* =========================
   CRIAR INIMIGO
========================= */

function createEnemy(
  type,
  isBoss = false
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "enemy" +
    (
      isBoss
        ? " boss"
        : ""
    );


  const shape =
    document.createElement(
      "div"
    );


  shape.className =
    "enemyShape " +
    type;


  const hpBar =
    document.createElement(
      "div"
    );


  hpBar.className =
    "enemyHp";


  const hpFill =
    document.createElement(
      "div"
    );


  hpFill.className =
    "enemyHpFill";


  hpBar.appendChild(
    hpFill
  );


  element.appendChild(
    shape
  );


  element.appendChild(
    hpBar
  );


  battlefield.appendChild(
    element
  );


  const wave =
    game.wave;


  const power =
    Math.pow(
      1.075,
      wave - 1
    );


  let maxHp =
    65 * power;


  let speed =
    42 *
    Math.pow(
      1.022,
      wave - 1
    );


  let damage =
    8 * power;


  let reward =
    Math.floor(
      8 *
      Math.pow(
        1.055,
        wave - 1
      )
    );


  if (
    type === "circle"
  ) {

    maxHp *= 1.25;

    speed *= .68;

    damage *= 3.2;

    reward *= 1.7;

  }


  if (
    type === "square"
  ) {

    maxHp *= .8;

    speed *= 1.55;

    damage *= .9;

  }


  if (
    type === "triangle"
  ) {

    maxHp *= 1;

    speed *= 1.05;

    damage *= 1.4;

    reward *= 1.3;

  }


  if (
    type === "hexagon"
  ) {

    maxHp *= 4;

    speed *= .58;

    damage *= 1.4;

    reward *= 2.2;

  }


  if (
    type === "diamond"
  ) {

    maxHp *= 1.4;

    speed *= 1;

    damage *= 1.6;

    reward *= 2;

  }


  if (
    type === "star"
  ) {

    maxHp *= 1.8;

    speed *= .88;

    damage *= 2;

    reward *= 3;

  }


  if (isBoss) {

    maxHp *=
      20 +
      wave * .15;

    speed *= .8;

    damage *= 5;

    reward *= 15;

  }


  const width =
    battlefield.clientWidth;

  const height =
    battlefield.clientHeight;


  const side =
    Math.floor(
      Math.random() * 4
    );


  let x;
  let y;


  if (side === 0) {

    x =
      15 +
      Math.random() *
      (width - 30);

    y = -40;

  }

  else if (side === 1) {

    x =
      width + 40;

    y =
      15 +
      Math.random() *
      (height - 30);

  }

  else if (side === 2) {

    x =
      15 +
      Math.random() *
      (width - 30);

    y =
      height + 40;

  }

  else {

    x = -40;

    y =
      15 +
      Math.random() *
      (height - 30);

  }


  const enemy = {

    element,

    type,

    isBoss,

    hp: maxHp,

    maxHp,

    speed,

    damage,

    reward,

    x,

    y,

    attackCooldown: 0,

    shootCooldown:
      Math.random() * 1.5,

    alive: true

  };


  element.style.left =
    x + "px";


  element.style.top =
    y + "px";


  updateEnemyHp(
    enemy
  );


  return enemy;

}


/* =========================
   SPAWN NORMAL
========================= */

function spawnEnemy() {

  if (!waveRunning)
    return;


  if (
    enemiesSpawned >=
    enemiesToSpawn
  ) {

    clearInterval(
      spawnTimer
    );

    return;

  }


  enemiesSpawned++;


  const enemy =
    createEnemy(
      chooseEnemyType()
    );


  enemies.push(
    enemy
  );

}


/* =========================
   SPAWN ENXAME
========================= */

function spawnSwarmEnemy() {

  if (!waveRunning)
    return;


  const enemy =
    createEnemy(
      chooseEnemyType()
    );


  enemies.push(
    enemy
  );

}


function spawnSwarm() {

  if (!waveRunning)
    return;


  const swarmAmount =
    Math.floor(
      15 +
      game.wave * 1.5
    );


  for (
    let i = 0;
    i < swarmAmount;
    i++
  ) {

    setTimeout(
      () => {

        if (!waveRunning)
          return;


        spawnSwarmEnemy();

      },

      i * 90

    );

  }

}


/* =========================
   BOSS
========================= */

function spawnBoss() {

  if (!waveRunning)
    return;


  bossPending = false;


  const bossTypes = [

    "circle",
    "hexagon",
    "star",
    "diamond"

  ];


  const type =
    bossTypes[
      Math.floor(
        Math.random() *
        bossTypes.length
      )
    ];


  const boss =
    createEnemy(
      type,
      true
    );


  enemies.push(
    boss
  );


  updateProgress();

}


/* =========================
   VIDA INIMIGO
========================= */

function updateEnemyHp(enemy) {

  const fill =
    enemy.element.querySelector(
      ".enemyHpFill"
    );


  fill.style.width =
    Math.max(

      0,

      enemy.hp /
      enemy.maxHp *
      100

    ) + "%";

}


/* =========================
   DANO
========================= */

function showDamage(
  enemy,
  damage,
  critical = false
) {

  const text =
    document.createElement(
      "div"
    );


  text.className =
    "damageText";


  text.textContent =
    Math.round(
      damage
    );


  if (critical) {

    text.classList.add(
      "critical"
    );

  }


  text.style.left =
    enemy.x + "px";


  text.style.top =
    enemy.y - 18 + "px";


  battlefield.appendChild(
    text
  );


  setTimeout(
    () => text.remove(),
    550
  );

}


/* =========================
   HIT
========================= */

function hitEnemy(
  enemy,
  damage,
  critical = false
) {

  if (!enemy.alive)
    return;


  enemy.hp -=
    damage;


  updateEnemyHp(
    enemy
  );


  showDamage(
    enemy,
    damage,
    critical
  );


  if (
    enemy.hp <= 0
  ) {

    killEnemy(
      enemy
    );

  }

}


/* =========================
   MORTE
========================= */

function killEnemy(enemy) {

  if (!enemy.alive)
    return;


  enemy.alive = false;


  if (
    enemy.type === "star"
  ) {

    createExplosion(
      enemy.x,
      enemy.y
    );


    enemies.forEach(
      other => {

        if (
          other.alive &&
          other !== enemy
        ) {

          const d =
            Math.hypot(

              other.x -
                enemy.x,

              other.y -
                enemy.y

            );


          if (
            d < 90
          ) {

            hitEnemy(
              other,
              enemy.maxHp *
              .2
            );

          }

        }

      }
    );

  }


  game.money +=
    Math.floor(
      enemy.reward
    );


  enemy.element.remove();


  enemiesKilled++;


  updateUI();

  updateProgress();

  checkWaveFinished();

}


/* =========================
   EXPLOSÃO
========================= */

function createExplosion(
  x,
  y
) {

  const explosion =
    document.createElement(
      "div"
    );


  explosion.className =
    "explosion";


  explosion.style.left =

  explosion.style.top =

  battlefield.appendChild(
    explosion
  );


  setTimeout(

  );

}


/* =========================
   PROJÉTIL TORRE
========================= */

function fireProjectile(
  target,
  damage,
  type,
  critical = false
) {

  const projectile =
    document.createElement(
      "div"
    );


  projectile.className =
    "projectile " +
    type;


  battlefield.appendChild(
    projectile
  );


  const tower =
    getTowerPosition();


  projectiles.push({

    element: projectile,

    x: tower.x,

    y: tower.y,

    target,

    damage,

    critical,

    speed:
      type === "sniper"
        ? 1150
        : 1400,

    alive: true

  });

}


/* =========================
   BURST
========================= */

function fireBurst(
  target,
  damage,
  critical
) {

  const targets =
    enemies

      .filter(
        enemy =>
          enemy.alive &&
          distanceToTower(enemy) <=
          game.tower.range
      )

      .sort(
        (a, b) =>
          distanceToTower(a) -
          distanceToTower(b)
      )

      .slice(0, 3);


  targets.forEach(
    (enemy, index) => {

      setTimeout(
        () => {

          if (
            enemy.alive
          ) {

            fireProjectile(

              enemy,

              damage * .65,

              "burst",

              critical

            );

          }

        },

        index * 55

      );

    }
  );

}


/* =========================
   ATAQUE DA TORRE
   FOCO NO MAIS PRÓXIMO
========================= */

function towerAttack() {

  if (!waveRunning)
    return;


  const valid =
    enemies.filter(
      enemy =>
        enemy.alive &&
        distanceToTower(enemy) <=
        game.tower.range
    );


  if (
    valid.length === 0
  )
    return;


  /*
    A torre sempre escolhe
    o inimigo que estiver
    MAIS PERTO dela.

    Não existe mais prioridade
    para Boss ou tipo específico.
  */

  valid.sort(
    (a, b) =>

      distanceToTower(a) -
      distanceToTower(b)

  );


  const target =
    valid[0];


  let damage =
    game.tower.damage;


  let critical = false;


  if (
    Math.random() <
    game.tower.crit
  ) {

    damage *= 2;

    critical = true;

  }


  aimTower(
    target
  );


  if (
    target.type ===
    "circle"
  ) {

    fireProjectile(

      target,

      damage,

      "sniper",

      critical

    );

  }

  else if (
    target.type ===
    "triangle"
  ) {

    fireBurst(

      target,

      damage,

      critical

    );

  }

  else {

    fireProjectile(

      target,

      damage,

      "pistol",

      critical

    );

  }

}


/* =========================
   MIRAR
========================= */

function aimTower(enemy) {

  const tower =
    getTowerPosition();


  const angle =
    Math.atan2(

      enemy.y -
        tower.y,

      enemy.x -
        tower.x

    );


  towerBarrel.style.transform =
    `rotate(${angle + Math.PI / 2}rad)`;

}


/* =========================
   TIRO INIMIGO
========================= */

function enemyShoot(enemy) {

  if (
    !isEnemyFullyVisible(
      enemy
    )
  )
    return false;


  const tower =
    getTowerPosition();


  const projectile =
    document.createElement(
      "div"
    );


  projectile.className =
    "projectile enemyBullet";


  battlefield.appendChild(
    projectile
  );


  enemyProjectiles.push({

    element: projectile,

    x: enemy.x,

    y: enemy.y,

    targetX: tower.x,

    targetY: tower.y,

    damage: enemy.damage,

    speed:
      enemy.type === "circle"
        ? 600
        : 700,

    alive: true

  });


  return true;

}


/* =========================
   LASER
========================= */

function enemyLaser(enemy) {

  if (
    !isEnemyFullyVisible(
      enemy
    )
  )
    return false;


  const tower =
    getTowerPosition();


  const dx =
    tower.x -
    enemy.x;


  const dy =
    tower.y -
    enemy.y;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  const angle =
    Math.atan2(
      dy,
      dx
    );


  const laser =
    document.createElement(
      "div"
    );


  laser.className =
    "laser";


  laser.style.left =
    enemy.x + "px";


  laser.style.top =
    enemy.y + "px";


  laser.style.width =
    distance + "px";


  laser.style.transform =
    `rotate(${angle}rad)`;


  battlefield.appendChild(
    laser
  );


  damageTower(
    enemy.damage *
    .35
  );


  setTimeout(
    () => laser.remove(),
    180
  );


  return true;

}


/* =========================
   DANO TORRE
========================= */

function damageTower(amount) {

  if (!waveRunning)
    return;


  const damage =
    amount *
    (
      1 -
      game.tower.defense
    );


  game.tower.hp -=
    damage;


  updateUI();


  if (
    game.tower.hp <= 0
  ) {

    game.tower.hp = 0;

    gameOver();

  }

}


/* =========================
   GAME LOOP
========================= */

let lastTime =
  performance.now();


function gameLoop(
  currentTime
) {

  const delta =
    (
      currentTime -
      lastTime
    ) / 1000;


  lastTime =
    currentTime;


  enemies.forEach(
    enemy => {

      if (
        !enemy.alive
      )
        return;


      const tower =
        getTowerPosition();


      const dx =
        tower.x -
        enemy.x;


      const dy =
        tower.y -
        enemy.y;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      if (
        enemy.type ===
        "circle"
      ) {

        const fullyVisible =
          isEnemyFullyVisible(
            enemy
          );


        if (
          !fullyVisible ||
          distance > 210
        ) {

          enemy.x +=
            dx / distance *
            enemy.speed *
            delta;


          enemy.y +=
            dy / distance *
            enemy.speed *
            delta;

        }


        if (
          fullyVisible
        ) {

          enemy.shootCooldown -=
            delta;


          if (
            enemy.shootCooldown <=
            0
          ) {

            const fired =
              enemyShoot(
                enemy
              );


            if (fired) {

              enemy.shootCooldown =
                2.7;

            }

            else {

              enemy.shootCooldown =
                .1;

            }

          }

        }

      }


      else if (
        enemy.type ===
        "diamond"
      ) {

        const fullyVisible =
          isEnemyFullyVisible(
            enemy
          );


        if (
          !fullyVisible ||
          distance > 150
        ) {

          enemy.x +=
            dx / distance *
            enemy.speed *
            delta;


          enemy.y +=
            dy / distance *
            enemy.speed *
            delta;

        }


        if (
          fullyVisible
        ) {

          enemy.shootCooldown -=
            delta;


          if (
            enemy.shootCooldown <=
            0
          ) {

            const fired =
              enemyLaser(
                enemy
              );


            if (fired) {

              enemy.shootCooldown =
                2.2;

            }

            else {

              enemy.shootCooldown =
                .1;

            }

          }

        }

      }


      else {

        if (
          distance > 48
        ) {

          enemy.x +=
            dx / distance *
            enemy.speed *
            delta;


          enemy.y +=
            dy / distance *
            enemy.speed *
            delta;

        }


        if (
          enemy.type ===
          "square"
        ) {

          enemy.shootCooldown -=
            delta;


          if (
            enemy.shootCooldown <= 0 &&
            distance < 250 &&
            isEnemyFullyVisible(
              enemy
            )
          ) {

            const fired =
              enemyShoot(
                enemy
              );


            if (fired) {

              enemy.shootCooldown =
                .75;

            }

          }

        }


        else if (
          enemy.type ===
          "triangle"
        ) {

          enemy.shootCooldown -=
            delta;


          if (
            enemy.shootCooldown <= 0 &&
            distance < 300 &&
            isEnemyFullyVisible(
              enemy
            )
          ) {

            const fired =
              enemyShoot(
                enemy
              );


            if (fired) {

              enemy.shootCooldown =
                2.3;

            }

          }

        }


        if (
          distance < 48
        ) {

          enemy.attackCooldown -=
            delta;


          if (
            enemy.attackCooldown <=
            0
          ) {

            damageTower(
              enemy.damage
            );


            enemy.attackCooldown =
              1;

          }

        }

      }


      enemy.element.style.left =
        enemy.x + "px";


      enemy.element.style.top =
        enemy.y + "px";

    }
  );


  /* =========================
     PROJÉTEIS DA TORRE
  ========================= */

  projectiles.forEach(
    projectile => {

      if (
        !projectile.alive
      )
        return;


      const target =
        projectile.target;


      if (
        !target ||
        !target.alive
      ) {

        projectile.alive =
          false;


        projectile.element.remove();

        return;

      }


      const dx =
        target.x -
        projectile.x;


      const dy =
        target.y -
        projectile.y;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      if (
        distance < 10
      ) {

        hitEnemy(

          target,

          projectile.damage,

          projectile.critical

        );


        projectile.alive =
          false;


        projectile.element.remove();

        return;

      }


      const movement =
        projectile.speed *
        delta;


      projectile.x +=
        dx / distance *
        movement;


      projectile.y +=
        dy / distance *
        movement;


      projectile.element.style.left =
        projectile.x + "px";


      projectile.element.style.top =
        projectile.y + "px";

    }
  );


  projectiles =
    projectiles.filter(
      p => p.alive
    );


  /* =========================
     PROJÉTEIS INIMIGOS
  ========================= */

  enemyProjectiles.forEach(
    projectile => {

      if (
        !projectile.alive
      )
        return;


      const dx =
        projectile.targetX -
        projectile.x;


      const dy =
        projectile.targetY -
        projectile.y;


      const distance =
        Math.hypot(
          dx,
          dy
        );


      if (
        distance < 10
      ) {

        damageTower(
          projectile.damage
        );


        projectile.alive =
          false;


        projectile.element.remove();

        return;

      }


      const movement =
        projectile.speed *
        delta;


      projectile.x +=
        dx / distance *
        movement;


      projectile.y +=
        dy / distance *
        movement;


      projectile.element.style.left =
        projectile.x + "px";


      projectile.element.style.top =
        projectile.y + "px";

    }
  );


  enemyProjectiles =
    enemyProjectiles.filter(
      p => p.alive
    );


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================
   INICIAR RODADA
========================= */

function startWave() {

  if (waveRunning)
    return;


  waveRunning = true;


  enemies = [];

  projectiles = [];

  enemyProjectiles = [];


  enemiesSpawned = 0;

  enemiesKilled = 0;


  bossPending = false;


  enemiesToSpawn =
    Math.floor(
      5 +
      game.wave * 1.8
    );


  const swarmWave =
    game.wave % 5 === 0;


  const swarmAmount =
    swarmWave
      ? Math.floor(
          15 +
          game.wave * 1.5
        )
      : 0;


  const bossWave =
    game.wave % 10 === 0;


  totalWaveEnemies =
    enemiesToSpawn +
    swarmAmount +
    (
      bossWave
        ? 1
        : 0
    );


  updateProgress();


  if (bossWave) {

    bossPending = true;


    bossMessage.style.display =
      "block";


    setTimeout(
      () => {

        bossMessage.style.display =
          "none";

      },
      2200
    );


    setTimeout(
      () => {

        if (waveRunning) {

          spawnBoss();

        }

      },
      1200
    );

  }


  if (swarmWave) {

    swarmMessage.style.display =
      "block";


    setTimeout(
      () => {

        swarmMessage.style.display =
          "none";

      },
      2200
    );


    setTimeout(
      () => {

        if (waveRunning) {

          spawnSwarm();

        }

      },
      700
    );

  }


  const spawnDelay =
    Math.max(

      110,

      600 -
      game.wave * 5

    );


  spawnTimer =
    setInterval(

      spawnEnemy,

      spawnDelay

    );


  restartAttackTimer();


  startButton.textContent =
    "RODADA " +
    game.wave;


  updateUI();


  spawnEnemy();

}


/* =========================
   FIM DA RODADA
========================= */

function checkWaveFinished() {

  if (!waveRunning)
    return;


  const alive =
    enemies.filter(
      enemy =>
        enemy.alive
    ).length;


  if (

    enemiesSpawned >=
      enemiesToSpawn &&

    alive === 0 &&

    !bossPending

  ) {

    finishWave();

  }

}


/* =========================
   TERMINAR RODADA
========================= */

function finishWave() {

  waveRunning = false;


  clearInterval(
    spawnTimer
  );


  clearInterval(
    attackTimer
  );


  const bonus =
    Math.floor(
      25 +
      game.wave * 4
    );


  game.money +=
    bonus;


  game.tower.hp =
    Math.min(

      game.tower.maxHp,

      game.tower.hp +
      game.tower.maxHp *
      .15

    );


  game.wave++;


  enemiesKilled =
    totalWaveEnemies;


  updateProgress();


  saveGame();

  updateUI();


  startButton.textContent =
    "COMEÇAR RODADA " +
    game.wave;

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

  waveRunning = false;


  clearInterval(
    spawnTimer
  );


  clearInterval(
    attackTimer
  );


  enemies.forEach(
    enemy => {

      if (
        enemy.element
      ) {

        enemy.element.remove();

      }

    }
  );


  projectiles.forEach(
    projectile => {

      if (
        projectile.element
      ) {

        projectile.element.remove();

      }

    }
  );


  enemyProjectiles.forEach(
    projectile => {

      if (
        projectile.element
      ) {

        projectile.element.remove();

      }

    }
  );


  enemies = [];

  projectiles = [];

  enemyProjectiles = [];


  bossPending = false;


  bossMessage.style.display =
    "none";


  swarmMessage.style.display =
    "none";


  lostWave.textContent =
    game.wave;


  overlay.style.display =
    "flex";


  startButton.textContent =
    "COMEÇAR RODADA " +
    game.wave;


  saveGame();

}


/* =========================
   TENTAR NOVAMENTE
========================= */

function retryWave() {

  overlay.style.display =
    "none";


  game.tower.hp =
    game.tower.maxHp;


  enemiesKilled = 0;

  totalWaveEnemies = 0;


  updateUI();


  startWave();

}


/* =========================
   BOTÕES
========================= */

startButton.onclick =
  startWave;


retryButton.onclick =
  retryWave;


/* =========================
   INICIALIZAÇÃO
========================= */

loadGame();

updateUI();

requestAnimationFrame(
  gameLoop
);

</script>
