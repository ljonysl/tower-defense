<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Shape Defense</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #06080d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    touch-action: manipulation;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {

    position: relative;

    width: 100%;
    max-width: 520px;

    height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #171c2a 0%,
            #0b0e16 48%,
            #05070b 100%
        );
}


/* =====================================================
   TOPO
===================================================== */

#topBar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 12px;

    z-index: 100;

    background:
        rgba(5,7,12,0.92);

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(8px);
}

.stat {

    min-width: 95px;
}

.statTitle {

    font-size: 10px;

    color: #7e879b;

    text-transform: uppercase;

    margin-bottom: 3px;
}

.statValue {

    font-size: 16px;

    font-weight: bold;
}

#money {

    text-align: right;

    color: #ffd54a;
}

#waveBox {

    text-align: center;
}

#waveLabel {

    font-size: 9px;

    color: #7e879b;

    text-transform: uppercase;
}

#waveNumber {

    font-size: 20px;

    font-weight: bold;
}


/* =====================================================
   CAMPO DE BATALHA
===================================================== */

#battlefield {

    position: absolute;

    top: 64px;
    left: 0;

    width: 100%;

    bottom: 285px;

    overflow: hidden;
}


/* GRADE */

#battlefield::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: 0.22;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        );

    background-size: 35px 35px;
}


/* CÍRCULO DE ARENA */

#arena {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 82%;
    height: 78%;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(100,150,220,0.12);

    border-radius: 50%;

    box-shadow:
        inset 0 0 60px rgba(50,100,180,0.06);
}


/* =====================================================
   TORRE CENTRAL
===================================================== */

#towerArea {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 150px;

    transform:
        translate(-50%, -50%);

    z-index: 50;
}


/* alcance */

#towerRange {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 300px;
    height: 300px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(90,170,255,0.18);

    pointer-events: none;
}


/* torre */

#tower {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 70px;
    height: 85px;

    transform:
        translate(-50%, -50%);
}


/* corpo */

.towerBody {

    position: absolute;

    left: 7px;
    bottom: 0;

    width: 56px;
    height: 50px;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #8798b3,
            #354158
        );

    border:
        2px solid #b7c5d9;

    box-shadow:

        0 0 25px
        rgba(80,150,255,0.25),

        inset 0 0 18px
        rgba(255,255,255,0.08);
}


/* cabeça */

.towerHead {

    position: absolute;

    left: 18px;
    bottom: 38px;

    width: 34px;
    height: 37px;

    border-radius: 8px;

    background: #596983;

    border:
        2px solid #c0ccdf;
}


/* canhão */

.towerBarrel {

    position: absolute;

    left: 30px;
    top: 2px;

    width: 10px;
    height: 42px;

    border-radius: 5px;

    background: #dce3ef;

    transform-origin:
        50% 100%;

    z-index: 5;
}


/* núcleo */

.towerCore {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 13px;
    height: 13px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #66b8ff;

    box-shadow:
        0 0 15px #66b8ff;
}


/* vida */

#towerHp {

    position: absolute;

    left: 50%;
    bottom: -13px;

    transform:
        translateX(-50%);

    width: 110px;
    height: 8px;

    background: #202532;

    border-radius: 10px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,0.12);
}

#towerHpFill {

    width: 100%;
    height: 100%;

    background: #5de58a;

    transition:
        width 0.2s;
}


/* =====================================================
   INIMIGOS
===================================================== */

.enemy {

    position: absolute;

    width: 38px;
    height: 38px;

    transform:
        translate(-50%, -50%);

    z-index: 30;
}


/* barra */

.enemyHp {

    position: absolute;

    left: 50%;
    top: -9px;

    width: 44px;
    height: 5px;

    transform:
        translateX(-50%);

    background: #20242e;

    border-radius: 10px;

    overflow: hidden;
}

.enemyHpFill {

    width: 100%;
    height: 100%;

    background: #6de18c;
}


/* formas */

.enemyShape {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 28px;
    height: 28px;

    transform:
        translate(-50%, -50%);
}


/* círculo */

.circle {

    border-radius: 50%;

    background: #4d9cff;

    box-shadow:
        0 0 16px
        rgba(77,156,255,0.8);
}


/* quadrado */

.square {

    background: #ff4e61;

    border-radius: 5px;

    box-shadow:
        0 0 15px
        rgba(255,78,97,0.75);
}


/* triângulo */

.triangle {

    width: 0;
    height: 0;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-left:
        17px solid transparent;

    border-right:
        17px solid transparent;

    border-bottom:
        31px solid #ffd04c;

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,208,76,0.8)
        );
}


/* estrela */

.star {

    background: #c56cff;

    clip-path:
        polygon(
            50% 0%,
            61% 36%,
            100% 36%,
            69% 58%,
            81% 100%,
            50% 74%,
            19% 100%,
            31% 58%,
            0% 36%,
            39% 36%
        );

    box-shadow:
        0 0 16px #c56cff;
}


/* hexágono */

.hexagon {

    background: #8793a8;

    clip-path:
        polygon(
            25% 3%,
            75% 3%,
            100% 50%,
            75% 97%,
            25% 97%,
            0% 50%
        );

    box-shadow:
        0 0 12px
        rgba(150,160,180,0.6);
}


/* losango */

.diamond {

    background: #36e6c1;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border-radius: 5px;

    box-shadow:
        0 0 15px
        rgba(54,230,193,0.8);
}


/* BOSS */

.boss .enemyShape {

    width: 50px;
    height: 50px;
}

.boss {

    width: 58px;
    height: 58px;
}

.boss .enemyHp {

    width: 70px;
    height: 7px;
}


/* =====================================================
   PROJÉTEIS
===================================================== */

.projectile {

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 80;
}

.projectile.sniper {

    width: 13px;
    height: 13px;

    background: #78b9ff;

    box-shadow:
        0 0 16px #78b9ff;
}

.projectile.pistol {

    width: 7px;
    height: 7px;

    background: #ff6675;

    box-shadow:
        0 0 9px #ff6675;
}

.projectile.burst {

    background: #ffd45c;

    box-shadow:
        0 0 10px #ffd45c;
}

.projectile.enemyBullet {

    width: 8px;
    height: 8px;

    background: #ff5570;

    box-shadow:
        0 0 10px #ff5570;
}


/* =====================================================
   LASER
===================================================== */

.laser {

    position: absolute;

    height: 3px;

    transform-origin:
        0 50%;

    background: #3de8c2;

    box-shadow:
        0 0 10px #3de8c2;

    pointer-events: none;

    z-index: 25;
}


/* =====================================================
   EXPLOSÃO
===================================================== */

.explosion {

    position: absolute;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        3px solid #ffb94c;

    transform:
        translate(-50%, -50%);

    animation:
        explode 0.45s forwards;

    pointer-events: none;

    z-index: 90;
}

@keyframes explode {

    from {

        opacity: 1;

        width: 20px;
        height: 20px;
    }

    to {

        opacity: 0;

        width: 100px;
        height: 100px;
    }
}


/* =====================================================
   PAINEL INFERIOR
===================================================== */

#bottomPanel {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 285px;

    padding: 8px 10px;

    z-index: 100;

    background:
        rgba(10,13,21,0.97);

    border-top:
        1px solid
        rgba(255,255,255,0.1);

    backdrop-filter: blur(10px);
}


/* info */

#towerInfo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 7px;
}

#towerName {

    font-size: 15px;

    font-weight: bold;
}

#towerLevel {

    font-size: 11px;

    color: #8993a8;
}


/* upgrades */

#upgradeGrid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 6px;
}

.upgrade {

    min-height: 51px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 9px;

    background: #151a26;

    color: white;

    padding: 6px 8px;

    text-align: left;
}

.upgrade:active {

    transform:
        scale(0.97);
}

.upgrade:disabled {

    opacity: 0.4;
}

.upgradeTop {

    display: flex;

    justify-content:
        space-between;
}

.upgradeName {

    font-size: 11px;

    font-weight: bold;
}

.upgradeLevel {

    font-size: 10px;

    color: #7d879c;
}

.upgradeBottom {

    display: flex;

    justify-content:
        space-between;

    margin-top: 4px;
}

.upgradeEffect {

    font-size: 9px;

    color: #8993a8;
}

.upgradeCost {

    font-size: 10px;

    color: #ffd54a;

    font-weight: bold;
}


/* iniciar */

#startButton {

    width: 100%;
    height: 39px;

    margin-top: 7px;

    border: none;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #438cff,
            #675bff
        );

    color: white;

    font-size: 14px;

    font-weight: bold;
}

#startButton:active {

    transform:
        scale(0.98);
}


/* =====================================================
   OVERLAY
===================================================== */

#overlay {

    position: absolute;

    inset: 0;

    z-index: 300;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(2,4,8,0.86);

    backdrop-filter:
        blur(8px);
}

#overlayBox {

    width: 86%;

    max-width: 370px;

    padding: 25px 20px;

    border-radius: 18px;

    text-align: center;

    background: #111621;

    border:
        1px solid
        rgba(255,255,255,0.12);
}

#overlayTitle {

    font-size: 27px;

    font-weight: bold;

    margin-bottom: 10px;
}

#overlayText {

    color: #9ba5b8;

    line-height: 1.5;

    margin-bottom: 20px;
}

#retryButton {

    width: 100%;

    height: 48px;

    border: none;

    border-radius: 10px;

    background: #438cff;

    color: white;

    font-size: 16px;

    font-weight: bold;
}


/* =====================================================
   TEXTO DE DANO
===================================================== */

.damageText {

    position: absolute;

    z-index: 200;

    pointer-events: none;

    font-size: 13px;

    font-weight: bold;

    animation:
        floatDamage 0.7s forwards;
}

.critical {

    font-size: 16px;

    color: #ffd54a;
}

@keyframes floatDamage {

    from {

        opacity: 1;

        transform:
            translate(-50%, 0);
    }

    to {

        opacity: 0;

        transform:
            translate(-50%, -32px);
    }
}


/* =====================================================
   BOSS MESSAGE
===================================================== */

#bossMessage {

    position: absolute;

    top: 78px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 150;

    display: none;

    width: 90%;

    text-align: center;

    padding: 8px;

    border-radius: 8px;

    background:
        rgba(80,20,100,0.85);

    border:
        1px solid
        rgba(220,120,255,0.4);

    color: #e8b7ff;

    font-size: 13px;

    font-weight: bold;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-height: 700px) {

    #battlefield {

        bottom: 260px;
    }

    #bottomPanel {

        height: 260px;
    }

    .upgrade {

        min-height: 45px;
    }

}

</style>
</head>


<body>

<div id="game">


    <!-- =================================================
         TOPO
    ================================================= -->

    <div id="topBar">

        <div class="stat">

            <div class="statTitle">
                Vida
            </div>

            <div class="statValue">

                ❤️
                <span id="hpText">

                </span>

            </div>

        </div>


        <div id="waveBox">

            <div id="waveLabel">
                Rodada
            </div>

            <div id="waveNumber">
                1
            </div>

        </div>


        <div class="stat"
             id="money">

            <div class="statTitle">

            </div>

            <div class="statValue">

                🪙
                <span id="moneyText">
                    150
                </span>

            </div>

        </div>

    </div>


    <!-- =================================================
         CAMPO
    ================================================= -->

    <div id="battlefield">

        <div id="arena"></div>

        <div id="bossMessage">

        </div>


        <!-- TORRE -->

        <div id="towerArea">

            <div id="towerRange"></div>


            <div id="tower">

                <div
                    class="towerBarrel"
                    id="towerBarrel">
                </div>

                <div

                </div>

                <div

                </div>

                <div
                    class="towerCore">
                </div>

                    <div
                        id="towerHpFill">
                    </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         PAINEL
    ================================================= -->

    <div id="bottomPanel">

        <div id="towerInfo">

            <div>

                <div id="towerName">

                </div>

                <div id="towerLevel">

                    Nível
                    <span id="levelText">
                        1
                    </span>

                </div>

            </div>

            <div>

                ⚔️
                <span id="damageText">
                    20
                </span>

            </div>

        </div>


        <div id="upgradeGrid">


            <button
                class="upgrade"
                id="upgradeDamage">

                <div class="upgradeTop">

                    </span>

                    <span class="upgradeLevel">

                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    </span>

                    <span class="upgradeCost">

                </div>

            </button>


            <button
                class="upgrade"
                id="upgradeSpeed">

                <div class="upgradeTop">

                    <span class="upgradeName">

                    </span>

                    <span class="upgradeLevel">

                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    <span class="upgradeEffect">
                        +10%
                    </span>

                    <span class="upgradeCost">
                        🪙 70
                    </span>

                </div>

            </button>


            <button
                class="upgrade"
                id="upgradeRange">

                <div class="upgradeTop">

                    <span class="upgradeName">
                        🎯 Alcance
                    </span>

                    <span class="upgradeLevel">
                        Lv.
                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    <span class="upgradeEffect">
                        +15
                    </span>

                    <span class="upgradeCost">
                        🪙 80
                    </span>

                </div>

            </button>


            <button
                class="upgrade"
                id="upgradeHealth">

                <div class="upgradeTop">

                    <span class="upgradeName">

                    </span>

                    <span class="upgradeLevel">

                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    </span>

                    <span class="upgradeCost">

                    </span>

            </button>


            <button
                class="upgrade"
                id="upgradeDefense">

                <div class="upgradeTop">

                    <span class="upgradeName">
                        🛡️ Defesa
                    </span>

                    <span class="upgradeLevel">
                        Lv.
                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    </span>

                </div>

            </button>


            <button

                id="upgradeCrit">

                <div class="upgradeTop">

                    <span class="upgradeName">

                    </span>

                    <span class="upgradeLevel">
                        Lv.
                        <span>1</span>
                    </span>

                </div>

                <div class="upgradeBottom">

                    <span class="upgradeEffect">
                        +3%
                    </span>

                    <span class="upgradeCost">
                        🪙 150
                    </span>

                </div>

            </button>

        </div>


        <button id="startButton">

            ▶ COMEÇAR RODADA 1

        </button>

    </div>


    <!-- =================================================
         GAME OVER
    ================================================= -->

    <div id="overlay">

        <div id="overlayBox">

            <div id="overlayTitle">
                💀 TORRE DESTRUÍDA
            </div>

            <div id="overlayText">

                Você chegou à rodada
                <strong id="lostWave">
                    1
                </strong>.

                <br><br>

                Seus upgrades e moedas
                foram mantidos.

                <br>

                Tente novamente para
                superar esta rodada.

            </div>

            <button id="retryButton">

                🔄 TENTAR NOVAMENTE

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const battlefield =
    document.getElementById(
        "battlefield"
    );

const towerArea =
    document.getElementById(
        "towerArea"
    );

const towerBarrel =
    document.getElementById(
        "towerBarrel"
    );

const towerRange =
    document.getElementById(
        "towerRange"
    );

const towerHpFill =
    document.getElementById(
        "towerHpFill"
    );

const hpText =
    document.getElementById(
        "hpText"
    );

const moneyText =
    document.getElementById(
        "moneyText"
    );

const waveNumber =
    document.getElementById(
        "waveNumber"
    );

const damageText =
    document.getElementById(
        "damageText"
    );

const levelText =
    document.getElementById(
        "levelText"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const lostWave =
    document.getElementById(
        "lostWave"
    );

const retryButton =
    document.getElementById(
        "retryButton"
    );

const bossMessage =
    document.getElementById(
        "bossMessage"
    );


/* =====================================================
   SAVE
===================================================== */

let game = {

    money: 150,

    wave: 1,

    tower: {

        level: 1,

        hp: 1000,

        maxHp: 1000,

        damage: 20,

        attackSpeed: 800,

        range: 170,

        defense: 0,

        crit: 0

    },

    upgrades: {

        damage: 1,

        speed: 1,

        range: 1,

        health: 1,

        defense: 1,

        crit: 1

    }

};


/* =====================================================
   LOAD
===================================================== */

function loadGame() {

    const save =
        localStorage.getItem(
            "shapeDefenseSave"
        );

    if (!save)
        return;

    try {

        const data =
            JSON.parse(save);

        game = data;

    } catch {

        console.log(
            "Save inválido."
        );

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveGame() {

    localStorage.setItem(
        "shapeDefenseSave",
        JSON.stringify(game)
    );

}


/* =====================================================
   ESTADO
===================================================== */

let enemies = [];

let projectiles = [];

let enemyProjectiles = [];

let lasers = [];

let waveRunning = false;

let spawnTimer = null;

let attackTimer = null;

let enemiesToSpawn = 0;

let enemiesSpawned = 0;

let enemiesKilled = 0;


/* =====================================================
   POSIÇÃO DA TORRE
===================================================== */

function getTowerPosition() {

    return {

        x:
            battlefield.clientWidth / 2,

        y:
            battlefield.clientHeight / 2

    };

}


/* =====================================================
   DISTÂNCIA
===================================================== */

function distanceToTower(enemy) {

    const tower =
        getTowerPosition();

    return Math.hypot(

        enemy.x - tower.x,

        enemy.y - tower.y

    );

}


/* =====================================================
   ATUALIZAR UI
===================================================== */

function updateUI() {

    moneyText.textContent =
        Math.floor(game.money);

    hpText.textContent =
        Math.max(
            0,
            Math.floor(game.tower.hp)
        );

    waveNumber.textContent =
        game.wave;

    damageText.textContent =
        Math.floor(
            game.tower.damage
        );

    levelText.textContent =
        game.tower.level;


    const hp =
        Math.max(
            0,
            Math.min(
                100,
                game.tower.hp /
                game.tower.maxHp *
                100
            )
        );

    towerHpFill.style.width =
        hp + "%";


    towerRange.style.width =
        game.tower.range * 2 + "px";

    towerRange.style.height =
        game.tower.range * 2 + "px";


    updateUpgradeUI();

}


/* =====================================================
   CUSTO
===================================================== */

function upgradeCost(type) {

    const level =
        game.upgrades[type];

    const base = {

        damage: 50,

        speed: 70,

        range: 80,

        health: 100,

        defense: 120,

        crit: 150

    };

    return Math.floor(

        base[type] *
        Math.pow(
            1.23,
            level - 1
        )

    );

}

/* =====================================================
   COMPRAR UPGRADE
===================================================== */

function buyUpgrade(type) {

    if (waveRunning)
        return;

    const cost =
        upgradeCost(type);

    if (
        game.money < cost
    )
        return;


    game.money -= cost;

    game.upgrades[type]++;


    if (type === "damage") {

        game.tower.damage +=
            8 +
            Math.floor(
                game.upgrades.damage *
                1.5
            );

    }


    if (type === "speed") {

        game.tower.attackSpeed *=
            0.90;

        game.tower.attackSpeed =
            Math.max(
                180,
                game.tower.attackSpeed
            );

    }


    if (type === "range") {

        game.tower.range += 15;

    }


    if (type === "health") {

        game.tower.maxHp += 150;

        game.tower.hp =
            game.tower.maxHp;

    }


    if (type === "defense") {

        game.tower.defense +=
            0.05;

        game.tower.defense =
            Math.min(
                0.75,
                game.tower.defense
            );

    }


    if (type === "crit") {

        game.tower.crit +=
            0.03;

        game.tower.crit =
            Math.min(
                0.75,
                game.tower.crit
            );

    }


    game.tower.level++;


    saveGame();

    updateUI();

}


for (
    const type in upgradeButtons
) {

    upgradeButtons[type].onclick =
        () => buyUpgrade(type);

}


/* =====================================================
   TIPO DE INIMIGO
===================================================== */

function chooseEnemyType() {

    const roll =
        Math.random();

    const wave =
        game.wave;


    if (wave < 3) {

        return roll < 0.7
            ? "square"
            : "circle";

    }


    if (wave < 5) {

        if (roll < 0.45)
            return "square";

        if (roll < 0.75)
            return "circle";

        return "triangle";

    }


    if (wave < 10) {

        if (roll < 0.30)
            return "square";

        if (roll < 0.55)
            return "circle";

        if (roll < 0.75)
            return "triangle";

        return "hexagon";

    }


    if (roll < 0.20)
        return "square";

    if (roll < 0.40)
        return "circle";

    if (roll < 0.58)
        return "triangle";

    if (roll < 0.73)
        return "hexagon";

    if (roll < 0.88)
        return "diamond";

    return "star";

}


/* =====================================================
   CRIAR INIMIGO
===================================================== */

function createEnemy(
    type,
    isBoss = false
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "enemy" +
        (isBoss ? " boss" : "");


    const shape =
        document.createElement(
            "div"
        );

    shape.className =
        "enemyShape " +
        type;


    const hpBar =
        document.createElement(
            "div"
        );

    hpBar.className =
        "enemyHp";


    const hpFill =
        document.createElement(
            "div"
        );

    hpFill.className =
        "enemyHpFill";


    hpBar.appendChild(
        hpFill
    );


    element.appendChild(
        shape
    );

    element.appendChild(
        hpBar
    );


    battlefield.appendChild(
        element
    );


    /* =================================================
       ESCALA DA RODADA
    ================================================= */

    const wave =
        game.wave;


    /*
       A cada rodada:

       Vida aumenta muito
       Velocidade aumenta
       Dano aumenta
       Recompensa aumenta
    */


    const power =
        Math.pow(
            1.075,
            wave - 1
        );


    let maxHp =
        65 * power;

    let speed =
        32 *
        Math.pow(
            1.018,
            wave - 1
        );

    let damage =
        8 * power;

    let reward =
        Math.floor(
            8 *
            Math.pow(
                1.055,
                wave - 1
            )
        );


    /* =================================================
       MODIFICADORES
    ================================================= */


    if (type === "circle") {

        maxHp *= 1.25;

        speed *= 0.58;

        damage *= 3.2;

        reward *= 1.7;

    }


    if (type === "square") {

        maxHp *= 0.8;

        speed *= 1.35;

        damage *= 0.9;

    }


    if (type === "triangle") {

        maxHp *= 1.0;

        speed *= 0.9;

        damage *= 1.4;

        reward *= 1.3;

    }


    if (type === "hexagon") {

        maxHp *= 4;

        speed *= 0.48;

        damage *= 1.4;

        reward *= 2.2;

    }


    if (type === "diamond") {

        maxHp *= 1.4;

        speed *= 0.85;

        damage *= 1.6;

        reward *= 2;

    }


    if (type === "star") {

        maxHp *= 1.8;

        speed *= 0.75;

        damage *= 2;

        reward *= 3;

    }


    /* BOSS */

    if (isBoss) {

        maxHp *=
            20 +
            wave * 0.15;

        speed *= 0.7;

        damage *= 5;

        reward *= 15;

    }


    /* =================================================
       NASCER DOS 4 LADOS
    ================================================= */

    const width =
        battlefield.clientWidth;

    const height =
        battlefield.clientHeight;


    const side =
        Math.floor(
            Math.random() * 4
        );


    let x;
    let y;


    if (side === 0) {

        /* cima */

        x =
            20 +
            Math.random() *
            (width - 40);

        y = -45;

    }


    else if (side === 1) {

        /* direita */

        x = width + 45;

        y =
            20 +
            Math.random() *
            (height - 40);

    }


    else if (side === 2) {

        /* baixo */

        x =
            20 +
            Math.random() *
            (width - 40);

        y = height + 45;

    }


    else {

        /* esquerda */

        x = -45;

        y =
            20 +
            Math.random() *
            (height - 40);

    }


    const enemy = {

        element,

        type,

        isBoss,

        hp: maxHp,

        maxHp,

        speed,

        damage,

        reward,

        x,

        y,

        attackCooldown:
            0,

        shootCooldown:
            Math.random() * 2,

        alive: true

    };


    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    updateEnemyHp(enemy);

    return enemy;

}


/* =====================================================
   SPAWN
===================================================== */

function spawnEnemy() {

    if (!waveRunning)
        return;


    if (
        enemiesSpawned >=
        enemiesToSpawn
    ) {

        clearInterval(
            spawnTimer
        );

        return;

    }


    enemiesSpawned++;


    const type =
        chooseEnemyType();


    const enemy =
        createEnemy(
            type
        );


    enemies.push(
        enemy
    );

}


/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    const bossTypes = [

        "circle",
        "hexagon",
        "star",
        "diamond"

    ];


    const type =
        bossTypes[
            Math.floor(
                Math.random() *
                bossTypes.length
            )
        ];


    const boss =
        createEnemy(
            type,
            true
        );


    enemies.push(
        boss
    );

    enemiesToSpawn++;

}


/* =====================================================
   VIDA INIMIGO
===================================================== */

function updateEnemyHp(
    enemy
) {

    const fill =
        enemy.element.querySelector(
            ".enemyHpFill"
        );

    fill.style.width =
        Math.max(
            0,

        ) + "%";

}


/* =====================================================
   TEXTO DE DANO
===================================================== */

function showDamage(
    enemy,
    damage,
    critical = false
) {

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "damageText" +
        (
            critical
            ? " critical"
            : ""
        );

    text.textContent =
        critical
        ? "CRIT! " +
          Math.round(damage)
        : "-" +
          Math.round(damage);


    text.style.left =
        enemy.x + "px";

    text.style.top =
        enemy.y - 22 + "px";


    battlefield.appendChild(
        text
    );


    setTimeout(
        () => text.remove(),
        700
    );

}


/* =====================================================
   MATAR
===================================================== */

function killEnemy(
    enemy
) {

    if (!enemy.alive)
        return;


    enemy.alive = false;


    /*
       Se for estrela,
       explode ao morrer.
    */

    if (
        enemy.type === "star"
    ) {

        createExplosion(
            enemy.x,
            enemy.y
        );


        enemies.forEach(
            other => {

                if (
                    other.alive &&
                    other !== enemy
                ) {

                    const distance =
                        Math.hypot(
                            other.x -
                            enemy.x,

                            other.y -
                            enemy.y
                        );


                    if (
                        distance < 85
                    ) {

                        hitEnemy(
                            other,
                            enemy.maxHp *
                            0.20
                        );

                    }

                }

            }
        );

    }


    enemy.element.remove();


    game.money +=
        enemy.reward;


    enemiesKilled++;


    updateUI();

    checkWaveFinished();

}


/* =====================================================
   EXPLOSÃO
===================================================== */

function createExplosion(
    x,
    y
) {

    const explosion =
        document.createElement(
            "div"
        );

    explosion.className =
        "explosion";


    explosion.style.left =
        x + "px";

    explosion.style.top =

    battlefield.appendChild(
        explosion
    );


    setTimeout(
        () => explosion.remove(),

    );

}


/* =====================================================
   DANO INIMIGO
===================================================== */

function hitEnemy(
    enemy,
    damage
) {

    if (!enemy.alive)
        return;


    enemy.hp -=
        damage;


    updateEnemyHp(enemy);


    showDamage(
        enemy,
        damage
    );


    if (
        enemy.hp <= 0
    ) {

        killEnemy(enemy);

    }

}


/* =====================================================
   PROJÉTIL DA TORRE
===================================================== */

function fireProjectile(
    target,
    damage,
    type
) {

    const projectile =
        document.createElement(
            "div"
        );

    projectile.className =
        "projectile " +
        type;


    battlefield.appendChild(
        projectile
    );


    const tower =
        getTowerPosition();


    const object = {

        element:
            projectile,

        x:
            tower.x,

        y:
            tower.y,

        target,

        damage,

        speed:
            type === "sniper"
            ? 850
            : 1050,

        alive: true

    };


    projectiles.push(
        object
    );

}


/* =====================================================
   TORRE ATACA
===================================================== */

function towerAttack() {

    if (!waveRunning)
        return;


    const valid =
        enemies.filter(
            enemy =>

                enemy.alive &&

                distanceToTower(
                    enemy
                ) <=
                game.tower.range

        );


    if (
        valid.length === 0
    )
        return;


    /*
       Prioridade:

       boss primeiro
       depois inimigo mais próximo
    */

    valid.sort(
        (a,b) => {

            if (
                a.isBoss &&
                !b.isBoss
            )
                return -1;

            if (
                !a.isBoss &&
                b.isBoss
            )
                return 1;

            return (
                distanceToTower(a) -
                distanceToTower(b)
            );

        }
    );


    const target =
        valid[0];


    let damage =
        game.tower.damage;


    let critical = false;


    if (
        Math.random() <
        game.tower.crit
    ) {

        damage *= 2;

        critical = true;

    }


    /*
       O tiro da torre
       muda dependendo
       do inimigo.
    */


    if (
        target.type === "circle"
    ) {

        fireProjectile(
            target,
            damage,
            "sniper"
        );

    }


    else if (
        target.type === "triangle"
    ) {

        fireBurst(
            target,
            damage
        );

    }


    else {

        fireProjectile(
            target,
            damage,
            "pistol"
        );

    }


    /*
       Faz a torre mirar
    */

    aimTower(target);

}


/* =====================================================
   MIRA DA TORRE
===================================================== */

function aimTower(
    enemy
) {

    const tower =
        getTowerPosition();


    const angle =
        Math.atan2(
            enemy.y - tower.y,
            enemy.x - tower.x
        );


    towerBarrel.style.transform =
        `rotate(${angle + Math.PI / 2}rad)`;

}


/* =====================================================
   RAJADA
===================================================== */

function fireBurst(
    target,
    damage
) {

    const targets =
        enemies
            .filter(
                enemy =>
                    enemy.alive &&
                    distanceToTower(
                        enemy
                    ) <=
                    game.tower.range
            )
            .slice(0,3);


    targets.forEach(
        (enemy,index) => {

            setTimeout(
                () => {

                    if (
                        enemy.alive
                    ) {

                        fireProjectile(
                            enemy,
                            damage *
                            0.65,
                            "burst"
                        );

                    }

                },

                index * 90

            );

        }
    );

}


/* =====================================================
   TIRO DOS INIMIGOS
===================================================== */

function enemyShoot(
    enemy
) {

    const tower =
        getTowerPosition();


    const projectile =
        document.createElement(
            "div"
        );

    projectile.className =
        "projectile enemyBullet";


    battlefield.appendChild(
        projectile
    );


    enemyProjectiles.push({

        element:
            projectile,

        x:
            enemy.x,

        y:
            enemy.y,

        targetX:
            tower.x,

        targetY:
            tower.y,

        damage:
            enemy.damage,

        speed:
            enemy.type === "circle"
            ? 450
            : 520,

        alive: true

    });

}


/* =====================================================
   LASER DO LOSANGO
===================================================== */

function enemyLaser(
    enemy
) {

    const tower =
        getTowerPosition();


    const dx =
        tower.x -
        enemy.x;

    const dy =
        tower.y -
        enemy.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    const laser =
        document.createElement(
            "div"
        );

    laser.className =
        "laser";


    laser.style.left =
        enemy.x + "px";

    laser.style.top =
        enemy.y + "px";

    laser.style.width =
        distance + "px";

    laser.style.transform =
        `rotate(${angle}rad)`;


    battlefield.appendChild(
        laser
    );


    damageTower(
        enemy.damage *
        0.35
    );


    setTimeout(
        () => laser.remove(),
        250
    );

}


/* =====================================================
   DANO NA TORRE
===================================================== */

function damageTower(
    amount
) {

    if (!waveRunning)
        return;


    const damage =
        amount *
        (
            1 -
            game.tower.defense
        );


    game.tower.hp -=
        damage;


    updateUI();


    if (
        game.tower.hp <= 0
    ) {

        game.tower.hp = 0;

        gameOver();

    }

}


/* =====================================================
   LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
) {

    const delta =
        (
            currentTime -
            lastTime
        ) / 1000;


    lastTime =
        currentTime;


    /*
       INIMIGOS
    */

    enemies.forEach(
        enemy => {

            if (
                !enemy.alive
            )
                return;


            const tower =
                getTowerPosition();


            const dx =
                tower.x -
                enemy.x;

            const dy =
                tower.y -
                enemy.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            /*
               CÍRCULO
               sniper:
               para longe da torre
            */

            if (
                enemy.type === "circle"
            ) {

                if (
                    distance > 210
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;

                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                enemy.shootCooldown -=
                    delta;


                if (
                    enemy.shootCooldown <= 0
                ) {

                    enemyShoot(
                        enemy
                    );

                    enemy.shootCooldown =
                        2.7;

                }

            }


            /*
               LOSANGO
               laser
            */

            else if (
                enemy.type === "diamond"
            ) {

                if (
                    distance > 150
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;

                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                enemy.shootCooldown -=
                    delta;


                if (
                    enemy.shootCooldown <= 0
                ) {

                    enemyLaser(
                        enemy
                    );

                    enemy.shootCooldown =
                        2.2;

                }

            }


            /*
               OUTROS
            */

            else {

                if (
                    distance > 48
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;

                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                enemy.attackCooldown -=
                    delta;


                /*
                   Triângulo:
                   rajada
                */

                if (
                    enemy.type ===
                    "triangle"
                ) {

                    if (
                        enemy.shootCooldown <= 0 &&
                        distance < 300
                    ) {

                        enemyShoot(
                            enemy
                        );

                        enemyShoot(
                            enemy
                        );

                        enemyShoot(
                            enemy
                        );

                        enemy.shootCooldown =
                            2.5;

                    }

                    enemy.shootCooldown -=
                        delta;

                }


                /*
                   Quadrado:
                   pistola rápida
                */

                else if (
                    enemy.type ===
                    "square"
                ) {

                    if (
                        enemy.shootCooldown <= 0 &&
                        distance < 240
                    ) {

                        enemyShoot(
                            enemy
                        );

                        enemy.shootCooldown =
                            0.75;

                    }

                    enemy.shootCooldown -=
                        delta;

                }


                /*
                   Estrela:
                   aproxima e ataca
                */

                else {

                    if (
                        distance < 55 &&
                        enemy.attackCooldown <= 0
                    ) {

                        damageTower(
                            enemy.damage
                        );

                        enemy.attackCooldown =
                            1;

                    }

                }

            }


            /*
               Dano por contato
            */

            if (
                distance < 48
            ) {

                enemy.attackCooldown -=
                    delta;


                if (
                    enemy.attackCooldown <= 0
                ) {

                    damageTower(
                        enemy.damage
                    );

                    enemy.attackCooldown =
                        1;

                }

            }


            enemy.element.style.left =
                enemy.x + "px";

            enemy.element.style.top =
                enemy.y + "px";

        }
    );


    /*
       PROJÉTEIS DA TORRE
    */

    projectiles.forEach(
        projectile => {

            if (
                !projectile.alive
            )
                return;


            const target =
                projectile.target;


            if (
                !target ||
                !target.alive
            ) {

                projectile.alive =
                    false;

                projectile.element.remove();

                return;

            }


            const dx =
                target.x -
                projectile.x;

            const dy =
                target.y -
                projectile.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance < 10
            ) {

                hitEnemy(
                    target,
                    projectile.damage
                );


                projectile.alive =
                    false;

                projectile.element.remove();

                return;

            }


            const movement =
                projectile.speed *
                delta;


            projectile.x +=
                dx /
                distance *
                movement;

            projectile.y +=
                dy /
                distance *
                movement;


            projectile.element.style.left =
                projectile.x + "px";

            projectile.element.style.top =
                projectile.y + "px";

        }
    );


    projectiles =
        projectiles.filter(
            p => p.alive
        );


    /*
       PROJÉTEIS DOS INIMIGOS
    */

    enemyProjectiles.forEach(
        projectile => {

            if (
                !projectile.alive
            )
                return;


            const dx =
                projectile.targetX -
                projectile.x;

            const dy =
                projectile.targetY -
                projectile.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance < 10
            ) {

                damageTower(
                    projectile.damage
                );


                projectile.alive =
                    false;

                projectile.element.remove();

                return;

            }


            const movement =
                projectile.speed *
                delta;


            projectile.x +=
                dx /
                distance *
                movement;

            projectile.y +=
                dy /
                distance *
                movement;


            projectile.element.style.left =
                projectile.x + "px";

            projectile.element.style.top =
                projectile.y + "px";

        }
    );


    enemyProjectiles =
        enemyProjectiles.filter(
            p => p.alive
        );


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   INICIAR RODADA
===================================================== */

function startWave() {

    if (waveRunning)
        return;


    waveRunning = true;


    enemies = [];

    projectiles = [];

    enemyProjectiles = [];


    enemiesSpawned = 0;

    enemiesKilled = 0;


    /*
       Quantidade aumenta
       a cada rodada.
    */

    enemiesToSpawn =
        Math.floor(
            5 +
            game.wave * 1.8
        );


    /*
       Rodadas especiais
    */

    const bossWave =
        game.wave % 10 === 0 ||
        game.wave === 25 ||
        game.wave === 50 ||
        game.wave === 75 ||
        game.wave === 100;


    if (bossWave) {

        enemiesToSpawn += 1;

        setTimeout(
            () => {

                if (
                    waveRunning
                ) {

                    spawnBoss();

                }

            },
            1800
        );


        bossMessage.style.display =
            "block";


        setTimeout(
            () => {

                bossMessage.style.display =
                    "none";

            },
            2500
        );

    }


    const spawnDelay =
        Math.max(
            180,
            850 -
            game.wave * 5
        );


    spawnTimer =
        setInterval(
            spawnEnemy,
            spawnDelay
        );


    attackTimer =
        setInterval(
            towerAttack,
            game.tower.attackSpeed
        );


    startButton.textContent =
        "⚔️ RODADA " +
        game.wave +
        " EM ANDAMENTO";


    updateUI();


    spawnEnemy();

}


/* =====================================================
   TERMINAR RODADA
===================================================== */

function checkWaveFinished() {

    if (!waveRunning)
        return;


    const alive =
        enemies.filter(
            e => e.alive
        ).length;


    if (
        enemiesSpawned >=
        enemiesToSpawn &&
        alive === 0
    ) {

        finishWave();

    }

}


/* =====================================================
   FINALIZAR
===================================================== */

function finishWave() {

    waveRunning = false;


    clearInterval(
        spawnTimer
    );

    clearInterval(
        attackTimer
    );


    /*
       Bônus da rodada
    */

    const waveBonus =
        Math.floor(
            25 +
            game.wave *
            4
        );


    game.money +=
        waveBonus;


    /*
       Recupera 15% da vida
    */

    game.tower.hp =
        Math.min(
            game.tower.maxHp,

            game.tower.hp +
            game.tower.maxHp *
            0.15
        );


    game.wave++;


    saveGame();

    updateUI();


    startButton.textContent =
        "▶ COMEÇAR RODADA " +
        game.wave;

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    waveRunning = false;


    clearInterval(
        spawnTimer
    );

    clearInterval(
        attackTimer
    );


    enemies.forEach(
        enemy => {

            if (
                enemy.element
            )
                enemy.element.remove();

        }
    );


    projectiles.forEach(
        projectile => {

            if (
                projectile.element
            )
                projectile.element.remove();

        }
    );


    enemyProjectiles.forEach(
        projectile => {

            if (
                projectile.element
            )
                projectile.element.remove();

        }
    );


    enemies = [];

    projectiles = [];

    enemyProjectiles = [];


    /*
       IMPORTANTE:

       NÃO diminuímos moedas.

       NÃO diminuímos upgrades.

       NÃO diminuímos rodada.

       NÃO resetamos nada.
    */


    lostWave.textContent =
        game.wave;


    overlay.style.display =
        "flex";


    startButton.textContent =
        "▶ COMEÇAR RODADA " +
        game.wave;

}


/* =====================================================
   TENTAR NOVAMENTE
===================================================== */

function retryWave() {

    overlay.style.display =
        "none";


    /*
       Recupera a torre
       para uma nova tentativa.

       A rodada continua igual.
    */

    game.tower.hp =
        game.tower.maxHp;


    updateUI();


    startWave();

}


/* =====================================================
   START
===================================================== */

startButton.onclick =
    startWave;


retryButton.onclick =
    retryWave;


/* =====================================================
   INICIAR JOGO
===================================================== */

loadGame();

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
