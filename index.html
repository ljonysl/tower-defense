<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Shape Defense</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #06080d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    touch-action: manipulation;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;
}

button {

    font-family: inherit;

    -webkit-appearance: none;
    appearance: none;
}


/* =========================================================
   JOGO
========================================================= */

#game {

    position: relative;

    width: 100%;
    max-width: 520px;

    height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #171c2a 0%,
            #0b0e16 48%,
            #05070b 100%
        );
}


/* =========================================================
   TOPO
========================================================= */

#topBar {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        8px 12px;

    z-index: 100;

    background:
        rgba(5,7,12,0.94);

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(8px);
}

.stat {

    min-width: 95px;
}

.statTitle {

    font-size: 10px;

    color: #7e879b;

    text-transform: uppercase;

    margin-bottom: 3px;
}

.statValue {

    font-size: 16px;

    font-weight: bold;
}

#money {

    text-align: right;

    color: #ffd54a;
}

#waveBox {

    text-align: center;
}

#waveLabel {

    font-size: 9px;

    color: #7e879b;

    text-transform: uppercase;
}

#waveNumber {

    font-size: 20px;

    font-weight: bold;
}


/* =========================================================
   CAMPO
========================================================= */

#battlefield {

    position: absolute;

    top: 64px;
    left: 0;

    width: 100%;

    bottom: 300px;

    overflow: hidden;
}


/* grade */

#battlefield::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: 0.22;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    pointer-events: none;
}


/* arena */

#arena {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 88%;
    height: 88%;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(100,150,220,0.12);

    border-radius: 50%;

    box-shadow:
        inset 0 0 70px
        rgba(50,100,180,0.07);

    pointer-events: none;
}


/* =========================================================
   TORRE
========================================================= */

#towerArea {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 160px;
    height: 160px;

    transform:
        translate(-50%, -50%);

    z-index: 50;
}


/* alcance */

#towerRange {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 340px;
    height: 340px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(90,170,255,0.18);

    pointer-events: none;
}


/* torre */

#tower {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 74px;
    height: 88px;

    transform:
        translate(-50%, -50%);
}


/* corpo */

.towerBody {

    position: absolute;

    left: 7px;
    bottom: 0;

    width: 60px;
    height: 52px;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #899ab5,
            #354158
        );

    border:
        2px solid
        #b7c5d9;

    box-shadow:

        0 0 25px
        rgba(80,150,255,0.25),

        inset 0 0 18px
        rgba(255,255,255,0.08);
}


/* cabeça */

.towerHead {

    position: absolute;

    left: 19px;
    bottom: 39px;

    width: 36px;
    height: 38px;

    border-radius: 8px;

    background:
        #596983;

    border:
        2px solid
        #c0ccdf;

    z-index: 3;
}


/* canhão */

.towerBarrel {

    position: absolute;

    left: 32px;
    top: 0;

    width: 10px;
    height: 43px;

    border-radius: 5px;

    background:
        #dce3ef;

    transform-origin:
        50% 100%;

    z-index: 5;

    transition:
        transform 0.12s linear;
}


/* núcleo */

.towerCore {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 14px;
    height: 14px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        #66b8ff;

    box-shadow:
        0 0 16px
        #66b8ff;

    z-index: 10;
}


/* vida */

#towerHp {

    position: absolute;

    left: 50%;
    bottom: -14px;

    transform:
        translateX(-50%);

    width: 115px;
    height: 8px;

    background:
        #202532;

    border-radius: 10px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,0.12);

    z-index: 20;
}

#towerHpFill {

    width: 100%;
    height: 100%;

    background:
        #5de58a;

    transition:
        width 0.2s;
}


/* =========================================================
   INIMIGOS
========================================================= */

.enemy {

    position: absolute;

    width: 38px;
    height: 38px;

    transform:
        translate(-50%, -50%);

    z-index: 30;
}

.enemyHp {

    position: absolute;

    left: 50%;
    top: -9px;

    width: 44px;
    height: 5px;

    transform:
        translateX(-50%);

    background:
        #20242e;

    border-radius: 10px;

    overflow: hidden;
}

.enemyHpFill {

    width: 100%;
    height: 100%;

    background:
        #6de18c;
}

.enemyShape {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 28px;
    height: 28px;

    transform:
        translate(-50%, -50%);
}


/* círculo */

.circle {

    border-radius: 50%;

    background:
        #4d9cff;

    box-shadow:
        0 0 16px
        rgba(77,156,255,0.8);
}


/* quadrado */

.square {

    background:
        #ff4e61;

    border-radius: 5px;

    box-shadow:
        0 0 15px
        rgba(255,78,97,0.75);
}


/* triângulo */

.triangle {

    width: 0;
    height: 0;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-left:
        17px solid transparent;

    border-right:
        17px solid transparent;

    border-bottom:
        31px solid
        #ffd04c;

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,208,76,0.8)
        );
}


/* estrela */

.star {

    background:
        #c56cff;

    clip-path:
        polygon(
            50% 0%,
            61% 36%,
            100% 36%,
            69% 58%,
            81% 100%,
            50% 74%,
            19% 100%,
            31% 58%,
            0% 36%,
            39% 36%
        );
}


/* hexágono */

.hexagon {

    background:
        #8793a8;

    clip-path:
        polygon(
            25% 3%,
            75% 3%,
            100% 50%,
            75% 97%,
            25% 97%,
            0% 50%
        );
}


/* losango */

.diamond {

    background:
        #36e6c1;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    border-radius:
        5px;

    box-shadow:
        0 0 15px
        rgba(54,230,193,0.8);
}


/* boss */

.boss {

    width: 62px;
    height: 62px;
}

.boss .enemyShape {

    width: 50px;
    height: 50px;
}

.boss .enemyHp {

    width: 75px;
    height: 7px;
}


/* =========================================================
   PROJÉTEIS
========================================================= */

.projectile {

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 80;
}

.projectile.sniper {

    width: 13px;
    height: 13px;

    background:
        #78b9ff;

    box-shadow:
        0 0 16px
        #78b9ff;
}

.projectile.pistol {

    width: 7px;
    height: 7px;

    background:
        #ff6675;

    box-shadow:
        0 0 9px
        #ff6675;
}

.projectile.burst {

    background:
        #ffd45c;

    box-shadow:
        0 0 10px
        #ffd45c;
}

.projectile.enemyBullet {

    width: 8px;
    height: 8px;

    background:
        #ff5570;

    box-shadow:
        0 0 10px
        #ff5570;
}


/* =========================================================
   LASER
========================================================= */

.laser {

    position: absolute;

    height: 3px;

    transform-origin:
        0 50%;

    background:
        #3de8c2;

    box-shadow:
        0 0 10px
        #3de8c2;

    pointer-events: none;

    z-index: 25;
}


/* =========================================================
   EXPLOSÃO
========================================================= */

.explosion {

    position: absolute;

    width: 20px;
    height: 20px;

    border:
        3px solid
        #ffb94c;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    animation:
        explode 0.45s forwards;

    pointer-events: none;

    z-index: 90;
}

@keyframes explode {

    from {

        opacity: 1;

        width: 20px;
        height: 20px;
    }

    to {

        opacity: 0;

        width: 100px;
        height: 100px;
    }
}


/* =========================================================
   PAINEL
========================================================= */

#bottomPanel {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 300px;

    padding:
        8px 10px;

    z-index: 100;

    background:
        rgba(10,13,21,0.98);

    border-top:
        1px solid
        rgba(255,255,255,0.1);

    backdrop-filter:
        blur(10px);
}


/* informação da torre */

#towerInfo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 7px;
}

#towerName {

    font-size: 15px;

    font-weight: bold;
}

#towerLevel {

    font-size: 11px;

    color: #8993a8;
}


/* =========================================================
   UPGRADES
========================================================= */

#upgradeGrid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 6px;
}

.upgrade {

    min-height: 52px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 9px;

    background:
        #151a26;

    color: white;

    padding:
        6px 8px;

    text-align: left;

    cursor: pointer;

    position: relative;

    z-index: 200;

    transition:
        transform 0.08s,
        background 0.1s;
}

.upgrade:active {

    transform:
        scale(0.96);

    background:
        #20283a;
}


/*
   IMPORTANTE:
   Não vamos usar disabled para
   bloquear os upgrades durante
   a rodada.
*/

.upgrade.cantBuy {

    opacity: 0.45;
}

.upgradeTop {

    display: flex;

    justify-content:
        space-between;
}

.upgradeName {

    font-size: 11px;

    font-weight: bold;
}

.upgradeLevel {

    font-size: 10px;

    color: #7d879c;
}

.upgradeBottom {

    display: flex;

    justify-content:
        space-between;

    margin-top: 4px;
}

.upgradeEffect {

    font-size: 9px;

    color: #8993a8;
}

.upgradeCost {

    font-size: 10px;

    color: #ffd54a;

    font-weight: bold;
}


/* =========================================================
   BOTÃO DA RODADA
========================================================= */

#startButton {

    width: 100%;
    height: 40px;

    margin-top: 7px;

    border: none;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #438cff,
            #675bff
        );

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;
}

#startButton:active {

    transform:
        scale(0.98);
}


/* =========================================================
   GAME OVER
========================================================= */

#overlay {

    position: absolute;

    inset: 0;

    z-index: 300;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(2,4,8,0.86);

    backdrop-filter:
        blur(8px);
}

#overlayBox {

    width: 86%;

    max-width: 370px;

    padding:
        25px 20px;

    border-radius: 18px;

    text-align: center;

    background:
        #111621;

    border:
        1px solid
        rgba(255,255,255,0.12);
}

#overlayTitle {

    font-size: 27px;

    font-weight: bold;

    margin-bottom: 10px;
}

#overlayText {

    color:
        #9ba5b8;

    line-height: 1.5;

    margin-bottom: 20px;
}

#retryButton {

    width: 100%;

    height: 48px;

    border: none;

    border-radius: 10px;

    background:
        #438cff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================================================
   BOSS
========================================================= */

#bossMessage {

    position: absolute;

    top: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 150;

    display: none;

    width: 90%;

    text-align: center;

    padding: 8px;

    border-radius: 8px;

    background:
        rgba(80,20,100,0.85);

    border:
        1px solid
        rgba(220,120,255,0.4);

    color:
        #e8b7ff;

    font-size: 13px;

    font-weight: bold;
}


/* =========================================================
   DANO
========================================================= */

.damageText {

    position: absolute;

    z-index: 200;

    pointer-events: none;

    font-size: 13px;

    font-weight: bold;

    animation:
        floatDamage 0.7s forwards;
}

@keyframes floatDamage {

    from {

        opacity: 1;

        transform:
            translate(-50%, 0);
    }

    to {

        opacity: 0;

        transform:
            translate(-50%, -32px);
    }
}


/* =========================================================
   MOBILE PEQUENO
========================================================= */

@media (max-height: 700px) {

    #battlefield {

        bottom: 270px;
    }

    #bottomPanel {

        height: 270px;
    }

    .upgrade {

        min-height: 45px;
    }

}

</style>

</head>


<body>


<div id="game">


<!-- =====================================================
     TOPO
===================================================== -->

<div id="topBar">

    <div class="stat">

        <div class="statTitle">
            Vida
        </div>

        <div class="statValue">

            ❤️
            <span id="hpText">
                1000
            </span>

        </div>

    </div>


    <div id="waveBox">

        <div id="waveLabel">
            Rodada
        </div>

        <div id="waveNumber">
            1
        </div>

    </div>


    <div
        class="stat"
        id="money">

        <div class="statTitle">
            Moedas
        </div>

        <div class="statValue">

            🪙
            <span id="moneyText">
                150
            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     CAMPO
===================================================== -->

<div id="battlefield">

    <div id="arena"></div>


    <div id="bossMessage">
        👑 BOSS DA RODADA
    </div>


    <!-- TORRE -->

    <div id="towerArea">

        <div id="towerRange"></div>


        <div id="tower">

            <div
                class="towerBarrel"
                id="towerBarrel">
            </div>

            <div
                class="towerHead">
            </div>

            <div
                class="towerBody">
            </div>

            <div
                class="towerCore">
            </div>

            <div id="towerHp">

                <div
                    id="towerHpFill">
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     PAINEL
===================================================== -->

<div id="bottomPanel">


    <div id="towerInfo">

        <div>

            <div id="towerName">
                TORRE CENTRAL
            </div>

            <div id="towerLevel">

                Nível
                <span id="levelText">
                    1
                </span>

            </div>

        </div>


        <div>

            ⚔️
            <span id="damageText">
                20
            </span>

        </div>

    </div>


    <div id="upgradeGrid">


        <!-- DANO -->

        <button
            class="upgrade"
            id="upgradeDamage">

            <div class="upgradeTop">

                <span class="upgradeName">
                    ⚔️ Dano
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    +8 dano
                </span>

                <span class="upgradeCost">
                    🪙 50
                </span>

            </div>

        </button>


        <!-- VELOCIDADE -->

        <button
            class="upgrade"
            id="upgradeSpeed">

            <div class="upgradeTop">

                <span class="upgradeName">
                    ⚡ Velocidade
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    +10%
                </span>

                <span class="upgradeCost">
                    🪙 70
                </span>

            </div>

        </button>


        <!-- ALCANCE -->

        <button
            class="upgrade"
            id="upgradeRange">

            <div class="upgradeTop">

                <span class="upgradeName">
                    🎯 Alcance
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    +15
                </span>

                <span class="upgradeCost">
                    🪙 80
                </span>

            </div>

        </button>


        <!-- VIDA -->

        <button
            class="upgrade"
            id="upgradeHealth">

            <div class="upgradeTop">

                <span class="upgradeName">
                    ❤️ Vida
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    +150 HP
                </span>

                <span class="upgradeCost">
                    🪙 100
                </span>

            </div>

        </button>


        <!-- DEFESA -->

        <button
            class="upgrade"
            id="upgradeDefense">

            <div class="upgradeTop">

                <span class="upgradeName">
                    🛡️ Defesa
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    -5% dano
                </span>

                <span class="upgradeCost">
                    🪙 120
                </span>

            </div>

        </button>


        <!-- CRÍTICO -->

        <button
            class="upgrade"
            id="upgradeCrit">

            <div class="upgradeTop">

                <span class="upgradeName">
                    💥 Crítico
                </span>

                <span class="upgradeLevel">

                    Lv.
                    <span>1</span>

                </span>

            </div>

            <div class="upgradeBottom">

                <span class="upgradeEffect">
                    +3%
                </span>

                <span class="upgradeCost">
                    🪙 150
                </span>

            </div>

        </button>

    </div>


    <button id="startButton">

        ▶ COMEÇAR RODADA 1

    </button>


</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="overlay">

    <div id="overlayBox">

        <div id="overlayTitle">
            💀 TORRE DESTRUÍDA
        </div>

        <div id="overlayText">

            Você chegou à rodada
            <strong id="lostWave">
                1
            </strong>.

            <br><br>

            🪙 Suas moedas foram mantidas.
            <br>
            ⬆️ Seus upgrades foram mantidos.

            <br><br>

            Tente novamente a mesma rodada.

        </div>


        <button id="retryButton">

            🔄 TENTAR NOVAMENTE

        </button>

    </div>

</div>


</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const battlefield =
    document.getElementById(
        "battlefield"
    );

const towerBarrel =
    document.getElementById(
        "towerBarrel"
    );

const towerRange =
    document.getElementById(
        "towerRange"
    );

const towerHpFill =
    document.getElementById(
        "towerHpFill"
    );

const hpText =
    document.getElementById(
        "hpText"
    );

const moneyText =
    document.getElementById(
        "moneyText"
    );

const waveNumber =
    document.getElementById(
        "waveNumber"
    );

const damageText =
    document.getElementById(
        "damageText"
    );

const levelText =
    document.getElementById(
        "levelText"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const lostWave =
    document.getElementById(
        "lostWave"
    );

const retryButton =
    document.getElementById(
        "retryButton"
    );

const bossMessage =
    document.getElementById(
        "bossMessage"
    );


/* =========================================================
   ESTADO DO JOGO
========================================================= */

let game = {

    money: 150,

    wave: 1,

    tower: {

        level: 1,

        hp: 1000,

        maxHp: 1000,

        damage: 20,

        attackSpeed: 800,

        range: 170,

        defense: 0,

        crit: 0

    },

    upgrades: {

        damage: 1,

        speed: 1,

        range: 1,

        health: 1,

        defense: 1,

        crit: 1

    }

};


/* =========================================================
   CARREGAR SAVE
========================================================= */

function loadGame() {

    const save =
        localStorage.getItem(
            "shapeDefenseSave"
        );

    if (!save)
        return;


    try {

        const data =
            JSON.parse(save);


        /*
           Só aceita o save se
           tiver uma estrutura válida.
        */

        if (
            data &&
            typeof data.money === "number" &&
            typeof data.wave === "number" &&
            data.tower &&
            data.upgrades
        ) {

            game = data;

        }

    } catch {

        console.log(
            "Não foi possível carregar o save."
        );

    }

}


/* =========================================================
   SALVAR
========================================================= */

function saveGame() {

    try {

        localStorage.setItem(
            "shapeDefenseSave",
            JSON.stringify(game)
        );

    } catch {

        console.log(
            "Não foi possível salvar."
        );

    }

}

/* =========================================================
   POSIÇÃO DA TORRE
========================================================= */

function getTowerPosition() {

    return {

        x:
            battlefield.clientWidth / 2,

        y:
            battlefield.clientHeight / 2

    };

}


/* =========================================================
   DISTÂNCIA
========================================================= */

function distanceToTower(enemy) {

    const tower =
        getTowerPosition();


    return Math.hypot(

        enemy.x -
        tower.x,

        enemy.y -
        tower.y

    );

}

/* =========================================================
   CUSTO
========================================================= */

function getUpgradeCost(
    type
) {

    const level =
        game.upgrades[type];


    const baseCosts = {

        damage: 50,

        speed: 70,

        range: 80,

        health: 100,

        defense: 120,

        crit: 150

    };


    return Math.floor(

        baseCosts[type] *

        Math.pow(
            1.23,
            level - 1
        )

    );

}


/* =========================================================
   ATUALIZAR BOTÕES
========================================================= */

function updateUpgradeUI() {

    for (
        const type in upgradeButtons
    ) {

        const button =
            upgradeButtons[type];


        const level =
            game.upgrades[type];


        const cost =
            getUpgradeCost(type);


        button.querySelector(
            ".upgradeLevel span"
        ).textContent =
            level;


        button.querySelector(
            ".upgradeCost"
        ).textContent =
            "🪙 " + cost;


        /*
           NÃO usamos disabled.

           Apenas mudamos visualmente
           quando não há dinheiro.
        */

        if (
            game.money < cost
        ) {

            button.classList.add(
                "cantBuy"
            );

        } else {

            button.classList.remove(
                "cantBuy"
            );

        }

    }

}


/* =========================================================
   COMPRAR UPGRADE
========================================================= */

function buyUpgrade(
    type
) {

    const cost =
        getUpgradeCost(type);


    /*
       Se não tem dinheiro,
       não faz nada.
    */

    if (
        game.money < cost
    ) {

        return;

    }


    /*
       Paga
    */

    game.money -=
        cost;


    /*
       Aumenta nível
    */

    game.upgrades[type]++;


    /* =====================================================
       APLICA UPGRADE
    ===================================================== */


    if (
        type === "damage"
    ) {

        game.tower.damage +=
            8 +
            Math.floor(
                game.upgrades.damage *
                1.5
            );

    }


    if (
        type === "speed"
    ) {

        /*
           Menor intervalo =
           maior velocidade
        */

        game.tower.attackSpeed *=
            0.90;


        game.tower.attackSpeed =
            Math.max(
                180,
                game.tower.attackSpeed
            );


        /*
           Se a rodada estiver
           acontecendo, reinicia
           o intervalo imediatamente.
        */

        if (waveRunning) {

            restartAttackTimer();

        }

    }


    if (
        type === "range"
    ) {

        game.tower.range +=
            15;

    }


    if (
        type === "health"
    ) {

        game.tower.maxHp +=
            150;


        game.tower.hp =
            game.tower.maxHp;

    }


    if (
        type === "defense"
    ) {

        game.tower.defense +=
            0.05;


        game.tower.defense =
            Math.min(
                0.75,
                game.tower.defense
            );

    }


    if (
        type === "crit"
    ) {

        game.tower.crit +=
            0.03;


        game.tower.crit =
            Math.min(
                0.75,
                game.tower.crit
            );

    }


    game.tower.level++;


    saveGame();

    updateUI();

}

/* =========================================================
   ESCOLHER INIMIGO
========================================================= */

function chooseEnemyType() {

    const roll =
        Math.random();


    const wave =
        game.wave;


    if (
        wave < 3
    ) {

        return roll < 0.7
            ? "square"
            : "circle";

    }


    if (
        wave < 5
    ) {

        if (
            roll < 0.45
        )
            return "square";

        if (
            roll < 0.75
        )
            return "circle";

        return "triangle";

    }


    if (
        wave < 10
    ) {

        if (
            roll < 0.30
        )
            return "square";

        if (
            roll < 0.55
        )
            return "circle";

        if (
            roll < 0.75
        )
            return "triangle";

        return "hexagon";

    }


    if (
        roll < 0.20
    )
        return "square";


    if (
        roll < 0.40
    )
        return "circle";


    if (
        roll < 0.58
    )
        return "triangle";


    if (
        roll < 0.73
    )
        return "hexagon";


    if (
        roll < 0.88
    )
        return "diamond";


    return "star";

}


/* =========================================================
   CRIAR INIMIGO
========================================================= */

function createEnemy(
    type,
    isBoss = false
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "enemy" +
        (
            isBoss
            ? " boss"
            : ""
        );


    const shape =
        document.createElement(
            "div"
        );


    shape.className =
        "enemyShape " +
        type;


    const hpBar =
        document.createElement(
            "div"
        );


    hpBar.className =
        "enemyHp";


    const hpFill =
        document.createElement(
            "div"
        );


    hpFill.className =
        "enemyHpFill";


    hpBar.appendChild(
        hpFill
    );


    element.appendChild(
        shape
    );

    element.appendChild(
        hpBar
    );


    battlefield.appendChild(
        element
    );


    /* =====================================================
       ESCALA
    ===================================================== */

    const wave =
        game.wave;


    /*
       Crescimento exponencial.

       Rodadas avançadas ficam
       realmente mais difíceis.
    */

    const power =
        Math.pow(
            1.075,
            wave - 1
        );


    let maxHp =
        65 * power;


    let speed =
        32 *
        Math.pow(
            1.018,
            wave - 1
        );


    let damage =
        8 * power;


    let reward =
        Math.floor(
            8 *
            Math.pow(
                1.055,
                wave - 1
            )
        );


    /* =====================================================
       CÍRCULO
    ===================================================== */

    if (
        type === "circle"
    ) {

        maxHp *= 1.25;

        speed *= 0.58;

        damage *= 3.2;

        reward *= 1.7;

    }


    /* =====================================================
       QUADRADO
    ===================================================== */

    if (
        type === "square"
    ) {

        maxHp *= 0.8;

        speed *= 1.35;

        damage *= 0.9;

    }


    /* =====================================================
       TRIÂNGULO
    ===================================================== */

    if (
        type === "triangle"
    ) {

        maxHp *= 1;

        speed *= 0.9;

        damage *= 1.4;

        reward *= 1.3;

    }


    /* =====================================================
       HEXÁGONO
    ===================================================== */

    if (
        type === "hexagon"
    ) {

        maxHp *= 4;

        speed *= 0.48;

        damage *= 1.4;

        reward *= 2.2;

    }


    /* =====================================================
       LOSANGO
    ===================================================== */

    if (
        type === "diamond"
    ) {

        maxHp *= 1.4;

        speed *= 0.85;

        damage *= 1.6;

        reward *= 2;

    }


    /* =====================================================
       ESTRELA
    ===================================================== */

    if (
        type === "star"
    ) {

        maxHp *= 1.8;

        speed *= 0.75;

        damage *= 2;

        reward *= 3;

    }


    /* =====================================================
       BOSS
    ===================================================== */

    if (
        isBoss
    ) {

        maxHp *=
            20 +
            wave * 0.15;


        speed *=
            0.7;


        damage *=
            5;


        reward *=
            15;

    }


    /* =====================================================
       NASCIMENTO
    ===================================================== */

    const width =
        battlefield.clientWidth;


    const height =
        battlefield.clientHeight;


    const side =
        Math.floor(
            Math.random() * 4
        );


    let x;
    let y;


    if (
        side === 0
    ) {

        x =
            20 +
            Math.random() *
            (width - 40);

        y = -45;

    }


    else if (
        side === 1
    ) {

        x =
            width + 45;

        y =
            20 +
            Math.random() *
            (height - 40);

    }


    else if (
        side === 2
    ) {

        x =
            20 +
            Math.random() *
            (width - 40);

        y =
            height + 45;

    }


    else {

        x = -45;

        y =
            20 +
            Math.random() *
            (height - 40);

    }


    const enemy = {

        element,

        type,

        isBoss,

        hp:
            maxHp,

        maxHp,

        speed,

        damage,

        reward,

        x,

        y,

        attackCooldown:
            0,

        shootCooldown:
            Math.random() *
            1.5,

        alive:
            true

    };


    element.style.left =
        x + "px";


    element.style.top =
        y + "px";


    updateEnemyHp(
        enemy
    );


    return enemy;

}


/* =========================================================
   SPAWN
========================================================= */

function spawnEnemy() {

    if (
        !waveRunning
    )
        return;


    if (
        enemiesSpawned >=
        enemiesToSpawn
    ) {

        clearInterval(
            spawnTimer
        );

        return;

    }


    enemiesSpawned++;


    const type =
        chooseEnemyType();


    const enemy =
        createEnemy(
            type
        );


    enemies.push(
        enemy
    );

}


/* =========================================================
   BOSS
========================================================= */

function spawnBoss() {

    if (
        !waveRunning
    )
        return;


    const bossTypes = [

        "circle",
        "hexagon",
        "star",
        "diamond"

    ];


    const type =
        bossTypes[
            Math.floor(
                Math.random() *
                bossTypes.length
            )
        ];


    const boss =
        createEnemy(
            type,
            true
        );


    enemies.push(
        boss
    );

}


/* =========================================================
   VIDA DO INIMIGO
========================================================= */

function updateEnemyHp(

) {

    const fill =

        );


    fill.style.width =

/* =========================================================
   ATINGIR
========================================================= */

function hitEnemy(
    enemy,
    damage,
    critical = false
) {

    if (
        !enemy.alive
    )
        return;


    enemy.hp -=
        damage;


    updateEnemyHp(
        enemy
    );


    showDamage(
        enemy,
        damage,
        critical
    );


    if (
        enemy.hp <= 0
    ) {

        killEnemy(
            enemy
        );

    }

}


/* =========================================================
   MATAR
========================================================= */

function killEnemy(
    enemy
) {

    if (
        !enemy.alive
    )
        return;


    enemy.alive =
        false;


    /*
       ESTRELA EXPLODE
    */

    if (
        enemy.type === "star"
    ) {

        createExplosion(
            enemy.x,
            enemy.y
        );


        enemies.forEach(
            other => {

                if (
                    other.alive &&
                    other !== enemy
                ) {

                    const d =
                        Math.hypot(

                            other.x -
                            enemy.x,

                            other.y -
                            enemy.y

                        );


                    if (
                        d < 90
                    ) {

                        hitEnemy(
                            other,
                            enemy.maxHp *
                            0.2
                        );

                    }

                }

            }
        );

    }


    /*
       recompensa
    */

    game.money +=
        Math.floor(
            enemy.reward
        );


    enemy.element.remove();


    enemiesKilled++;


    updateUI();


    checkWaveFinished();

}

/* =========================================================
   PROJÉTIL DA TORRE
========================================================= */

function fireProjectile(
    target,
    damage,
    type,
    critical = false
) {

    const projectile =
        document.createElement(
            "div"
        );


    projectile.className =
        "projectile " +
        type;


    battlefield.appendChild(

    );

        getTowerPosition();


    projectiles.push({

        element:
            projectile,

        x:
            tower.x,

        y:

        target,

        damage,

        critical,

        speed:
            type === "sniper"
            ? 850
            : 1050,

        alive:
            true

    });

}


/* =========================================================
   RAJADA
========================================================= */

function fireBurst(
    target,
    damage,
    critical
) {

    const targets =
        enemies
            .filter(
                enemy =>

                    enemy.alive &&

                    distanceToTower(
                        enemy
                    ) <=
                    game.tower.range
            )
            .slice(
                0,
                3
            );


    targets.forEach(
        (
            enemy,
            index
        ) => {

            setTimeout(
                function () {

                    if (
                        enemy.alive
                    ) {

                        fireProjectile(

                            enemy,

                            damage *
                            0.65,

                            "burst",

                            critical

                        );

                    }

                },

                index * 90

            );

        }
    );

}


/* =========================================================
   ATAQUE DA TORRE
========================================================= */

function towerAttack() {

    if (
        !waveRunning
    )
        return;


    const valid =
        enemies.filter(
            enemy =>

                enemy.alive &&

                distanceToTower(
                    enemy
                ) <=
                game.tower.range
        );


    if (
        valid.length === 0
    )
        return;


    /*
       Boss tem prioridade
    */

    valid.sort(
        (
            a,
            b
        ) => {

            if (
                a.isBoss &&
                !b.isBoss
            )
                return -1;


            if (
                !a.isBoss &&
                b.isBoss
            )
                return 1;


            return (
                distanceToTower(a) -
                distanceToTower(b)
            );

        }
    );


    const target =
        valid[0];


    let damage =
        game.tower.damage;


    let critical =
        false;


    if (
        Math.random() <
        game.tower.crit
    ) {

        damage *= 2;

        critical =
            true;

    }


    /*
       mira
    */

    aimTower(
        target
    );


    /*
       tipo de tiro
    */

    if (
        target.type ===
        "circle"
    ) {

        fireProjectile(

            target,

            damage,

            "sniper",

            critical

        );

    }


    else if (
        target.type ===
        "triangle"
    ) {

        fireBurst(

            target,

            damage,

            critical

        );

    }


    else {

        fireProjectile(

            target,

            damage,

            "pistol",

            critical

        );

    }

}


/* =========================================================
   MIRAR
========================================================= */

function aimTower(
    enemy
) {

    const tower =
        getTowerPosition();


    const angle =
        Math.atan2(

            enemy.y -
            tower.y,

            enemy.x -
            tower.x

        );


    towerBarrel.style.transform =
        `rotate(${angle + Math.PI / 2}rad)`;

}


/* =========================================================
   TIRO DO INIMIGO
========================================================= */

function enemyShoot(
    enemy
) {

    const tower =
        getTowerPosition();


    const projectile =
        document.createElement(
            "div"
        );


    projectile.className =
        "projectile enemyBullet";


    battlefield.appendChild(
        projectile
    );


    enemyProjectiles.push({

        element:
            projectile,

        x:
            enemy.x,

        y:
            enemy.y,

        targetX:
            tower.x,

        targetY:
            tower.y,

        damage:
            enemy.damage,

        speed:
            enemy.type ===
            "circle"

            ? 450

            : 520,

        alive:
            true

    });

}


/* =========================================================
   LASER
========================================================= */

function enemyLaser(
    enemy
) {

    const tower =
        getTowerPosition();


    const dx =
        tower.x -
        enemy.x;


    const dy =
        tower.y -
        enemy.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        );


    const laser =
        document.createElement(
            "div"
        );


    laser.className =
        "laser";


    laser.style.left =
        enemy.x + "px";


    laser.style.top =
        enemy.y + "px";


    laser.style.width =
        distance + "px";


    laser.style.transform =
        `rotate(${angle}rad)`;


    battlefield.appendChild(
        laser
    );


    damageTower(
        enemy.damage *
        0.35
    );


    setTimeout(
        function () {

            laser.remove();

        },
        250
    );

}


/* =========================================================
   DANO NA TORRE
========================================================= */

function damageTower(
    amount
) {

    if (
        !waveRunning
    )
        return;


    const damage =
        amount *
        (
            1 -
            game.tower.defense
        );


    game.tower.hp -=
        damage;


    updateUI();


    if (
        game.tower.hp <= 0
    ) {

        game.tower.hp =
            0;


        gameOver();

    }

}


/* =========================================================
   LOOP DO JOGO
========================================================= */

let lastTime =
    performance.now();


function gameLoop(
    currentTime
) {

    const delta =
        (
            currentTime -
            lastTime
        ) / 1000;


    lastTime =
        currentTime;


    /* =====================================================
       INIMIGOS
    ===================================================== */

    enemies.forEach(
        enemy => {

            if (
                !enemy.alive
            )
                return;


            const tower =
                getTowerPosition();


            const dx =
                tower.x -
                enemy.x;


            const dy =
                tower.y -
                enemy.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            /*
               CÍRCULO
               SNIPER
            */

            if (
                enemy.type ===
                "circle"
            ) {

                if (
                    distance > 210
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;


                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                enemy.shootCooldown -=
                    delta;


                if (
                    enemy.shootCooldown <= 0
                ) {

                    enemyShoot(
                        enemy
                    );


                    enemy.shootCooldown =
                        2.7;

                }

            }


            /*
               LOSANGO
               LASER
            */

            else if (
                enemy.type ===
                "diamond"
            ) {

                if (
                    distance > 150
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;


                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                enemy.shootCooldown -=
                    delta;


                if (
                    enemy.shootCooldown <= 0
                ) {

                    enemyLaser(
                        enemy
                    );


                    enemy.shootCooldown =
                        2.2;

                }

            }


            /*
               RESTANTE
            */

            else {

                if (
                    distance > 48
                ) {

                    enemy.x +=
                        dx /
                        distance *
                        enemy.speed *
                        delta;


                    enemy.y +=
                        dy /
                        distance *
                        enemy.speed *
                        delta;

                }


                /*
                   QUADRADO
                   PISTOLA
                */

                if (
                    enemy.type ===
                    "square"
                ) {

                    enemy.shootCooldown -=
                        delta;


                    if (
                        enemy.shootCooldown <= 0 &&
                        distance < 250
                    ) {

                        enemyShoot(
                            enemy
                        );


                        enemy.shootCooldown =
                            0.75;

                    }

                }


                /*
                   TRIÂNGULO
                   RAJADA
                */

                else if (
                    enemy.type ===
                    "triangle"
                ) {

                    enemy.shootCooldown -=
                        delta;


                    if (
                        enemy.shootCooldown <= 0 &&
                        distance < 300
                    ) {

                        enemyShoot(
                            enemy
                        );


                        enemy.shootCooldown =
                            2.3;

                    }

                }


                /*
                   ATAQUE CORPO A CORPO
                */

                if (
                    distance < 48
                ) {

                    enemy.attackCooldown -=
                        delta;


                    if (
                        enemy.attackCooldown <= 0
                    ) {

                        damageTower(
                            enemy.damage
                        );


                        enemy.attackCooldown =
                            1;

                    }

                }

            }


            enemy.element.style.left =
                enemy.x + "px";


            enemy.element.style.top =
                enemy.y + "px";

        }
    );


    /* =====================================================
       PROJÉTEIS DA TORRE
    ===================================================== */

    projectiles.forEach(
        projectile => {

            if (
                !projectile.alive
            )
                return;


            const target =
                projectile.target;


            if (
                !target ||
                !target.alive
            ) {

                projectile.alive =
                    false;


                projectile.element.remove();


                return;

            }


            const dx =
                target.x -
                projectile.x;


            const dy =
                target.y -
                projectile.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance < 10
            ) {

                hitEnemy(

                    target,

                    projectile.damage,

                    projectile.critical

                );


                projectile.alive =
                    false;


                projectile.element.remove();


                return;

            }


            const movement =
                projectile.speed *
                delta;


            projectile.x +=
                dx /
                distance *
                movement;


            projectile.y +=
                dy /
                distance *
                movement;


            projectile.element.style.left =
                projectile.x + "px";


            projectile.element.style.top =
                projectile.y + "px";

        }
    );


    projectiles =
        projectiles.filter(
            p =>
                p.alive
        );


    /* =====================================================
       PROJÉTEIS DOS INIMIGOS
    ===================================================== */

    enemyProjectiles.forEach(
        projectile => {

            if (
                !projectile.alive
            )
                return;


            const dx =
                projectile.targetX -
                projectile.x;


            const dy =
                projectile.targetY -
                projectile.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance < 10
            ) {

                damageTower(
                    projectile.damage
                );


                projectile.alive =
                    false;


                projectile.element.remove();


                return;

            }


            const movement =
                projectile.speed *
                delta;


            projectile.x +=
                dx /
                distance *
                movement;


            projectile.y +=
                dy /
                distance *
                movement;


            projectile.element.style.left =
                projectile.x + "px";


            projectile.element.style.top =
                projectile.y + "px";

        }
    );


    enemyProjectiles =
        enemyProjectiles.filter(
            p =>
                p.alive
        );


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INICIAR RODADA
========================================================= */

function startWave() {

    if (
        waveRunning
    )
        return;


    waveRunning =
        true;


    enemies = [];

    projectiles = [];

    enemyProjectiles = [];


    enemiesSpawned =
        0;


    enemiesKilled =
        0;


    /*
       Quantidade
    */

    enemiesToSpawn =
        Math.floor(

            5 +
            game.wave *
            1.8

        );


    /*
       Boss a cada 10
    */

    const bossWave =
        game.wave % 10 === 0;


    if (
        bossWave
    ) {

        bossMessage.style.display =
            "block";


        setTimeout(
            function () {

                bossMessage.style.display =
                    "none";

            },
            2500
        );


        /*
           O boss é adicionado
           separadamente.
        */

        setTimeout(
            function () {

                if (
                    waveRunning
                ) {

                    spawnBoss();

                }

            },
            1800
        );

    }


    const spawnDelay =
        Math.max(

            180,

            850 -
            game.wave *
            5

        );


    spawnTimer =
        setInterval(
            spawnEnemy,
            spawnDelay
        );


    restartAttackTimer();


    startButton.textContent =
        "⚔️ RODADA " +
        game.wave;


    updateUI();


    spawnEnemy();

}


/* =========================================================
   VERIFICAR FIM
========================================================= */

function checkWaveFinished() {

    if (
        !waveRunning
    )
        return;


    const alive =
        enemies.filter(
            enemy =>
                enemy.alive
        ).length;


    if (

        enemiesSpawned >=
        enemiesToSpawn &&

        alive === 0

    ) {

        finishWave();

    }

}


/* =========================================================
   FINALIZAR RODADA
========================================================= */

function finishWave() {

    waveRunning =
        false;


    clearInterval(
        spawnTimer
    );


    clearInterval(
        attackTimer
    );


    /*
       Bônus por completar
    */

    const bonus =
        Math.floor(

            25 +
            game.wave *
            4

        );


    game.money +=
        bonus;


    /*
       Recuperação
    */

    game.tower.hp =
        Math.min(

            game.tower.maxHp,

            game.tower.hp +
            game.tower.maxHp *
            0.15

        );


    /*
       Próxima rodada
    */

    game.wave++;


    saveGame();

    updateUI();


    startButton.textContent =
        "▶ COMEÇAR RODADA " +
        game.wave;

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    waveRunning =
        false;


    clearInterval(
        spawnTimer
    );


    clearInterval(
        attackTimer
    );


    enemies.forEach(
        enemy => {

            if (
                enemy.element
            )
                enemy.element.remove();

        }
    );


    projectiles.forEach(
        projectile => {

            if (
                projectile.element
            )
                projectile.element.remove();

        }
    );


    enemyProjectiles.forEach(
        projectile => {

            if (
                projectile.element
            )
                projectile.element.remove();

        }
    );


    enemies = [];

    projectiles = [];

    enemyProjectiles = [];


    /*
       NÃO alteramos:

       moedas
       upgrades
       rodada
    */


    lostWave.textContent =
        game.wave;


    overlay.style.display =
        "flex";


    startButton.textContent =
        "▶ COMEÇAR RODADA " +
        game.wave;


    saveGame();

}


/* =========================================================
   TENTAR NOVAMENTE
========================================================= */

function retryWave() {

    overlay.style.display =
        "none";


    /*
       Cura completamente
       antes da nova tentativa.
    */

    game.tower.hp =
        game.tower.maxHp;


    updateUI();


    startWave();

}


/* =========================================================
   BOTÕES
========================================================= */

startButton.onclick =
    startWave;


retryButton.onclick =
    retryWave;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

loadGame();

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
